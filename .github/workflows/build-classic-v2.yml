name: Build WristHub Classic V2
on:
  workflow_dispatch:
  push:
    branches: [ "wristhub-classic-v2" ]
    paths:
      - "watchface-classic-v2/**"
      - ".github/workflows/build-classic-v2.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build APK
        working-directory: watchface-classic-v2
        run: gradle --no-daemon :watchface:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WristHub-Classic-V2
          path: watchface-classic-v2/watchface/build/outputs/apk/debug/watchface-debug.apk
          retention-days: 14
