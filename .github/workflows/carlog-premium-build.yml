name: Build CarLog Premium APK

on:
  push:
    branches: [ "carlog-premium" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Rebuild CarLog source
        run: |
          cat carlog_parts/part*.b64 > /tmp/carlog.b64
          tr -d '\n\r ' < /tmp/carlog.b64 | base64 -d > /tmp/CarLogPremium-source.zip
          unzip -t /tmp/CarLogPremium-source.zip
          rm -rf build-carlog
          mkdir build-carlog
          unzip -q /tmp/CarLogPremium-source.zip -d build-carlog

      - name: Build debug APK
        working-directory: build-carlog
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CarLog-Premium-APK
          path: build-carlog/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
