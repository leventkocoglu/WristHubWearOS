name: Build WristHub Dynamic Watch Face
on:
  workflow_dispatch:
  push:
    branches: [ "wristhub-face-dynamic-wff" ]
    paths:
      - "watchface-dynamic-wff/**"
      - ".github/workflows/build-dynamic-watchface.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build debug APK
        id: build
        working-directory: watchface-dynamic-wff
        shell: bash
        run: |
          set +e
          gradle --no-daemon :watchface:assembleDebug 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload build log
        uses: actions/upload-artifact@v4
        with:
          name: WristHub-Dynamic-BuildLog
          path: watchface-dynamic-wff/build.log
          retention-days: 2
      - name: Upload APK
        if: steps.build.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: WristHub-Dynamic-WatchFace
          path: watchface-dynamic-wff/watchface/build/outputs/apk/debug/watchface-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Fail if build failed
        if: steps.build.outputs.exit_code != '0'
        run: exit 1
