name: Build WristHub Sense V3

on:
  workflow_dispatch:
  push:
    branches: [ "main", "wristhub-v3-semantic" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-37.1" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Rebuild WristHub Sense V3 source
        run: |
          cat v3_parts/part*.b64 > /tmp/wristhub-v3.b64
          tr -d '\n\r ' < /tmp/wristhub-v3.b64 | base64 -d > /tmp/WristHubSenseV3.zip
          echo "91056e83187acd981e4aedd895c6f06b0994026bfbeeb9a2d91a645c1ebb085d  /tmp/WristHubSenseV3.zip" | sha256sum -c -
          unzip -t /tmp/WristHubSenseV3.zip
          rm -rf build-v3
          mkdir build-v3
          unzip -q /tmp/WristHubSenseV3.zip -d build-v3
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("build-v3/WristHubV3/mobile/src/main/AndroidManifest.xml")
          s = manifest.read_text()
          s = s.replace("@android:style/Theme.DeviceDefault.DayNight.NoActionBar", "@android:style/Theme.DeviceDefault.NoActionBar")
          manifest.write_text(s)

          service = Path("build-v3/WristHubV3/mobile/src/main/java/com/wristhub/sense/mobile/notifications/SemanticNotificationService.kt")
          s = service.read_text()
          s = s.replace("context.getSharedPreferences(PREFS, MODE_PRIVATE)", "context.getSharedPreferences(PREFS, android.content.Context.MODE_PRIVATE)")
          s = s.replace("requestRebind(ComponentName(context, SemanticNotificationService::class.java))", "NotificationListenerService.requestRebind(ComponentName(context, SemanticNotificationService::class.java))")
          service.write_text(s)
          PY

      - name: Unit tests
        working-directory: build-v3/WristHubV3
        run: gradle --no-daemon :mobile:testDebugUnitTest

      - name: Build phone and watch APKs
        working-directory: build-v3/WristHubV3
        run: gradle --no-daemon :mobile:assembleDebug :wear:assembleDebug

      - name: Upload WristHub Sense V3 APKs
        uses: actions/upload-artifact@v4
        with:
          name: WristHub-Sense-V3
          path: |
            build-v3/WristHubV3/mobile/build/outputs/apk/debug/mobile-debug.apk
            build-v3/WristHubV3/wear/build/outputs/apk/debug/wear-debug.apk
          if-no-files-found: error
          retention-days: 14
