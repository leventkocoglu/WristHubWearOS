name: Build Wear OS APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Extract WristHub project
        run: |
          rm -rf build-src
          mkdir build-src
          unzip -q WristHubWearOS_NextAction_V2.zip -d build-src

      - name: Unit tests
        working-directory: build-src/WristHubWearOS
        run: gradle --no-daemon testDebugUnitTest

      - name: Build debug APK
        working-directory: build-src/WristHubWearOS
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WristHub-debug-apk
          path: build-src/WristHubWearOS/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
