      - name: Unit tests
        working-directory: build-src/WristHubWearOS
        run: gradle --no-daemon testDebugUnitTest

      - name: Build debug APK
        working-directory: build-src/WristHubWearOS
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WristHub-debug-apk
          path: build-src/WristHubWearOS/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
