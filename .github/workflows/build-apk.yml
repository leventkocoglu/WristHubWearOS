name: Build Wear OS APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-37" "build-tools;35.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Rebuild WristHub archive
        run: |
          cat .github/archive/wristhub.part*.b64 > /tmp/wristhub.b64
          tr -d '\n\r ' < /tmp/wristhub.b64 | base64 -d > /tmp/WristHubWearOS.zip
          echo "3b79e200e761e017207f799ba59f50d5abb2a69d0acc460c4f58538ac7c2b59c  /tmp/WristHubWearOS.zip" | sha256sum -c -
          unzip -t /tmp/WristHubWearOS.zip
          rm -rf build-src
          mkdir build-src
          unzip -q /tmp/WristHubWearOS.zip -d build-src

      - name: Unit tests
        working-directory: build-src/WristHubWearOS
        run: gradle --no-daemon testDebugUnitTest

      - name: Build debug APK
        working-directory: build-src/WristHubWearOS
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WristHub-debug-apk
          path: build-src/WristHubWearOS/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
