name: Build CarLog PR APK

on:
  pull_request:
    branches: [ "main" ]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  build-carlog:
    if: github.head_ref == 'carlog-premium'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout CarLog branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Rebuild CarLog source
        run: |
          cat             carlog_parts/part_00.b64             carlog_parts/part_01.b64             carlog_parts/part_02.b64             carlog_parts/part_03.b64             carlog_parts/part_04.b64             carlog_parts/part_05.b64             carlog_parts/part_06.b64             carlog_parts/part_07.b64             > /tmp/carlog.b64
          tr -d '\n\r ' < /tmp/carlog.b64 | base64 -d > /tmp/CarLogPremium-source.zip
          echo "90119006c4faabbb143acbe74053c2c327b6b8bb16f9f60c99ce6f9b1c05698f  /tmp/CarLogPremium-source.zip" | sha256sum -c -
          rm -rf build-carlog
          mkdir build-carlog
          unzip -q /tmp/CarLogPremium-source.zip -d build-carlog
          printf 'android.useAndroidX=true\nandroid.enableJetifier=true\n' > build-carlog/gradle.properties

      - name: Build debug APK
        working-directory: build-carlog
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CarLog-Premium-APK
          path: build-carlog/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
