name: Build CarLog Premium V2 APK

on:
  pull_request:
    branches: [ "main" ]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  build-carlog-v2:
    if: github.head_ref == 'carlog-premium'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout CarLog V2 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Rebuild verified CarLog V2 source
        run: |
          cat carlog_v2/part_00.b64 carlog_v2/part_01.b64 carlog_v2/part_02.b64 carlog_v2/part_03.b64 carlog_v2/part_04.b64 carlog_v2/part_05.b64 carlog_v2/part_06.b64 carlog_v2/part_07.b64 > /tmp/carlog_v2.b64
          tr -d '\n\r ' < /tmp/carlog_v2.b64 | base64 -d > /tmp/CarLogPremiumV2-source.zip
          echo "f97f64e7d16f8a310f3796c94079bd13d7de3d7ae5ee4f80974a49c90a3f2f1c  /tmp/CarLogPremiumV2-source.zip" | sha256sum -c -
          unzip -t /tmp/CarLogPremiumV2-source.zip
          rm -rf build-v2
          mkdir build-v2
          unzip -q /tmp/CarLogPremiumV2-source.zip -d build-v2
          printf 'android.useAndroidX=true\nandroid.enableJetifier=true\n' > build-v2/CarLogPremiumV2/gradle.properties

      - name: Build V2 debug APK
        working-directory: build-v2/CarLogPremiumV2
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload V2 APK
        uses: actions/upload-artifact@v4
        with:
          name: CarLog-Premium-V2-APK
          path: build-v2/CarLogPremiumV2/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
