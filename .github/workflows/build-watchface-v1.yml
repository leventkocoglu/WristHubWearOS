name: Build WristHub Face V1
on:
  workflow_dispatch:
  push:
    branches: [ "wristhub-watchface-v1" ]
    paths:
      - "watchface-v1/**"
      - ".github/workflows/build-watchface-v1.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build APK
        working-directory: watchface-v1
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: WristHub-Face-V1
          path: watchface-v1/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
