name: WorkFlow English APK
on:
  push:
    branches: [workflow-english]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: workflow-english-v2-debug-key
      - run: node tests/logic.cjs
      - run: npm install --no-save playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/ui.cjs
      - run: gradle assembleDebug --no-daemon
      - run: $ANDROID_HOME/build-tools/35.0.0/apksigner verify --print-certs app/build/outputs/apk/debug/app-debug.apk
      - run: cp app/build/outputs/apk/debug/app-debug.apk WorkFlow-English-V10.apk
      - uses: actions/upload-artifact@v4
        with:
          name: WorkFlow-English-V10
          path: WorkFlow-English-V10.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: WorkFlow-English-V10-QA
          path: '*-v10.png'
          if-no-files-found: error
