name: WorkFlow English APK
on:
  push:
    branches: [workflow-english]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: gradle assembleDebug --no-daemon
      - run: cp app/build/outputs/apk/debug/app-debug.apk WorkFlow-English-V1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: WorkFlow-English-V1
          path: WorkFlow-English-V1.apk
          if-no-files-found: error
