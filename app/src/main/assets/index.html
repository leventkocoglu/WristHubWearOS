<!DOCTYPE html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WorkFlow English</title><style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#0b1220;color:#edf2fb}*{box-sizing:border-box}body{margin:0}main{max-width:760px;margin:auto;padding:22px 18px 100px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:27px;margin:6px 0}h2{font-size:23px}p{line-height:1.65;color:#bdc9dc}.tag{color:#70e5c2;font-size:12px;letter-spacing:2px}.card{background:#152137;border:1px solid #293953;border-radius:20px;padding:20px;margin:16px 0}.hero{background:linear-gradient(130deg,#183951,#18352f)}.stats{display:flex;gap:10px}.stats>div{flex:1;background:#101c30;padding:14px;border-radius:14px;font-size:13px}.stats b{display:block;font-size:25px;margin-bottom:4px}button,select{font:inherit;color:inherit;border:1px solid #385071;border-radius:12px;padding:13px;background:#1c2c46;cursor:pointer}button:disabled{opacity:.65;cursor:default}.primary{background:#72e5c1;color:#092b24;border:0;font-weight:700}button:hover{filter:brightness(1.1)}.options{display:grid;gap:10px}.options button{text-align:left}.good{border-color:#75efb6!important;background:#173b32!important}.bad{border-color:#f29a98!important;background:#452a35!important}.pill{display:inline-block;background:#273c58;padding:7px 10px;border-radius:20px;margin:4px;font-size:13px}textarea{display:block;width:100%;height:150px;background:#0e192a;color:#f0f5ff;border:1px solid #47627f;border-radius:12px;padding:14px;font:inherit;line-height:1.5;margin:12px 0}nav{position:fixed;bottom:0;left:0;right:0;background:#0e192aef;border-top:1px solid #293953;display:flex;justify-content:center;gap:6px;padding:12px}nav button{font-size:13px;padding:10px}.hidden{display:none}small{color:#a9b8cf;line-height:1.6}progress{width:100%;accent-color:#70e5c2}a{color:#75dfd4}.row{display:flex;gap:8px;flex-wrap:wrap}.message{font-size:18px;color:#eff4fb}.feedback{border-left:3px solid #70e5c2;padding-left:14px;margin-top:15px}details{margin-top:16px}summary{cursor:pointer;color:#72e5c1}.toast{color:#72e5c1}label{display:block;margin-top:12px}select{width:100%;margin-top:8px} @media(max-width:380px){nav button{font-size:11px;padding:9px 6px}}
</style><main><header><div><div class="tag">CONTROL TOWER • LEARN BY DOING</div><h1>WorkFlow English</h1></div><span>◉</span></header><div id="app"></div></main><nav><button onclick="home()">Merkez</button><button onclick="start()">Simülasyon</button><button onclick="review()">Tekrar</button><button onclick="theory()">TOC</button></nav><script>
const scenarios=[{"id": 0, "title": "Geciken gemi", "step": "Identify", "message": "The vessel departure has been delayed by 24 hours. The customer asks whether the original delivery date is still achievable. Customs clearance takes two days and has no spare capacity.", "options": ["Promise the original delivery date.", "Check customs capacity and revise the delivery estimate.", "Send more containers to the port."], "correct": 1, "why": "Darboğaz gümrük kapasitesi. Geminin gecikmesini tüm teslim zinciriyle değerlendir; doğrulanmamış tarih vaat etme.", "phrases": ["departure", "delivery estimate", "confirm"], "sample": "The vessel departure has been delayed by 24 hours. We are checking customs capacity and will confirm a revised delivery estimate by 15:00."}, {"id": 1, "title": "Eksik SI bilgisi", "step": "Exploit", "message": "The documentation team can process 12 shipments per day. Three submissions have missing consignee details. The shipping instruction deadline is 16:00.", "options": ["Submit all files even if incomplete.", "Wait until every shipment is ready.", "Validate complete files and request missing details immediately."], "correct": 2, "why": "Sınırlı dokümantasyon kapasitesini yeniden işleme harcatma. Hazır dosyaları işle, eksikleri ayrı takip et.", "phrases": ["missing details", "deadline", "complete"], "sample": "Three files have missing consignee details. Please provide the missing details by 14:00 so we can submit complete shipping instructions before the deadline."}, {"id": 2, "title": "Depo kuyruğu", "step": "Subordinate", "message": "Picking capacity is 80 pallets per day, but dispatch can load only 50. There are already 100 pallets waiting for dispatch.", "options": ["Align picking release with dispatch capacity.", "Increase picking to 100 pallets.", "Measure success only by picking output."], "correct": 0, "why": "Depo çıkışı 50 paletle sınırlıysa daha fazla toplama kuyruk oluşturur. İş salımını çıkış kapasitesine göre düzenle.", "phrases": ["capacity", "release", "backlog"], "sample": "Dispatch capacity is 50 pallets per day. We will align picking release with this limit to reduce the backlog and protect urgent orders."}, {"id": 3, "title": "Kapasite artırma", "step": "Elevate", "message": "Loading remains the constraint after appointment scheduling and paperwork preparation have been improved. Demand is consistently above the current capacity.", "options": ["Improve an unrelated reporting dashboard.", "Evaluate an additional loading shift.", "Keep releasing unlimited orders."], "correct": 1, "why": "Mevcut kapasiteyi iyi kullandıktan sonra ek vardiya gibi darboğaz kapasitesini artıran seçenekleri değerlendir.", "phrases": ["additional shift", "constraint", "evaluate"], "sample": "Loading remains our constraint. We propose an additional shift and will evaluate its cost and expected impact on daily dispatch capacity."}, {"id": 4, "title": "Yeni darboğaz", "step": "Repeat", "message": "An additional loading shift has removed the dispatch queue. Shipments now wait for a single customs reviewer.", "options": ["Continue investing only in loading.", "Ignore customs because dispatch improved.", "Reassess the constraint and focus on customs review."], "correct": 2, "why": "Darboğaz taşınabilir. Önceki iyileştirmeyi otomatik sürdürmek yerine yeni sınırı belirle.", "phrases": ["reassess", "customs review", "priority"], "sample": "The dispatch queue has been cleared. We will reassess the constraint and prioritise customs review to improve end-to-end delivery performance."}, {"id": 5, "title": "Müşteriye gecikme bildirimi", "step": "Identify", "message": "Two orders are delayed because export documents have not been approved. The customer requests a status update and a recovery plan.", "options": ["Explain the cause, next action and update time.", "Say everything is on track.", "Blame the document team without a plan."], "correct": 0, "why": "Önce sevkiyatı tutan engeli tanımla. İyi durum mesajı neden, aksiyon ve sonraki güncelleme zamanını içerir.", "phrases": ["approval", "recovery plan", "update"], "sample": "The orders are awaiting export document approval. Our recovery plan is to prioritise the review today. We will send the next update by 16:00."}, {"id": 6, "title": "Cut-off riski", "step": "Exploit", "message": "The terminal cut-off is 18:00. One truck slot remains. Order A has complete documents and is due today; order B has missing documents and is due next week.", "options": ["Send order B because it is larger.", "Assign the slot to order A.", "Leave the slot unused."], "correct": 1, "why": "Kıt slotu evrakı hazır ve acil siparişe ayır. Bu senaryoda büyüklük, teslim önceliğinden daha önemli değil.", "phrases": ["cut-off", "slot", "ready"], "sample": "We have assigned the remaining truck slot to order A, as its documents are ready and its delivery is due today. This protects the terminal cut-off."}, {"id": 7, "title": "Günlük toplantı", "step": "Subordinate", "message": "A manager wants every department to maximise its own output. Packing can handle 60 units per hour, while upstream teams can produce 100.", "options": ["Run all departments at full speed.", "Buy faster upstream equipment.", "Align upstream output with packing capacity."], "correct": 2, "why": "Yerel verimlilik artışı sistem çıktısını her zaman artırmaz. Bu akışta paketleme temposu diğer ekipleri yönlendirir.", "phrases": ["packing", "throughput", "align"], "sample": "Packing is limiting throughput to 60 units per hour. We should align upstream output with packing capacity rather than build excess inventory."}, {"id": 8, "title": "Taşıyıcı eskalasyonu", "step": "Exploit", "message": "Only one carrier confirmation is needed to release a priority shipment. The carrier has not replied, and the booking deadline is approaching.", "options": ["Escalate the pending confirmation with a clear deadline.", "Send vague reminders to everyone.", "Create duplicate bookings immediately."], "correct": 0, "why": "Engeli kaldırabilecek kişiye net talep, referans ve süre ilet. Tekrar işlem yaratmadan öncelikli akışı koru.", "phrases": ["pending", "confirmation", "booking"], "sample": "The carrier confirmation is still pending for our priority booking. Please confirm space availability by 13:00 so we can release the shipment before the deadline."}, {"id": 9, "title": "Gümrük incelemesi", "step": "Exploit", "message": "One customs reviewer handles all declarations. Incomplete files consume half of the reviewer’s day through repeated corrections.", "options": ["Send more incomplete files.", "Introduce a completeness check before review.", "Hire more warehouse pickers."], "correct": 1, "why": "Darboğazın zamanını korumak için ön kontrol uygula. Burada ön kontrol, inceleyicinin tekrar işini azaltır.", "phrases": ["declaration", "review", "corrections"], "sample": "We will check each declaration for completeness before customs review. This should reduce repeated corrections and protect the reviewer’s available time."}, {"id": 10, "title": "Gerçek ATD", "step": "Identify", "message": "The customer asks for actual departure time. Your system shows a planned departure only; there is no confirmed departure event.", "options": ["Report the planned time as actual.", "Invent an estimated actual departure.", "State that ATD is unconfirmed and request verification."], "correct": 2, "why": "Planlanan tarih ile gerçekleşen olay farklıdır. Veri doğruluğu engelini açıkça belirt; ATD uydurma.", "phrases": ["actual departure", "planned", "verified"], "sample": "Actual departure has not yet been verified. The system currently shows the planned departure only. We have requested carrier confirmation and will update you once confirmed."}, {"id": 11, "title": "Teslim önceliği", "step": "Subordinate", "message": "There are ten ready loads but only four dispatch slots. Two loads are due today, two tomorrow, and six next week. All loads require one slot.", "options": ["Assign slots by delivery urgency.", "Choose whichever customer emails most.", "Release all ten loads to the queue."], "correct": 0, "why": "Verilen eşit yük koşullarında teslim aciliyetiyle slotları planla. Gerçek işte sözleşme ve operasyon kısıtlarını da kontrol et.", "phrases": ["urgent", "allocate", "due"], "sample": "We will allocate today’s four dispatch slots to the loads due today and tomorrow. The remaining loads will be scheduled according to delivery urgency."}, {"id": 12, "title": "İyileştirme önerisi", "step": "Elevate", "message": "The documentation queue persists after templates and pre-checks have been introduced. A trained backup reviewer is available for a two-week pilot.", "options": ["Start a measured backup-reviewer pilot.", "Remove quality checks.", "Increase incoming files without a plan."], "correct": 0, "why": "İlk düzenlemeler yetersizse ek kapasiteyi kontrollü pilotla dene. Sonucu sistem akışında ölç.", "phrases": ["pilot", "backup reviewer", "measure"], "sample": "We propose a two-week pilot with a trained backup reviewer. We will measure completed files, turnaround time and error rates before deciding on a permanent change."}, {"id": 13, "title": "Yönetim özeti", "step": "Repeat", "message": "A process change reduced loading time, but total delivery lead time did not improve. The team needs to explain the result to management.", "options": ["Claim the whole system improved.", "Check where shipments now wait.", "Repeat the same loading change indefinitely."], "correct": 1, "why": "Tek aşamadaki hız artışı uçtan uca iyileşme olmayabilir. Bekleme noktalarını yeniden incele.", "phrases": ["lead time", "improvement", "waiting"], "sample": "Loading time has improved, but total delivery lead time remains unchanged. We will analyse where shipments are waiting and target the current constraint."}, {"id": 14, "title": "Zaman tamponu", "step": "Subordinate", "message": "The critical loading station often waits for documents. Documents should be ready two hours before loading, but are usually delivered at the last minute.", "options": ["Prepare documents earlier to protect loading.", "Keep documents until the truck arrives.", "Increase picking speed only."], "correct": 0, "why": "Zaman tamponu kritik istasyonun aç kalmasını önlemeye yardımcı olur. Tampon süresi bu örnekte varsayımdır.", "phrases": ["buffer", "in advance", "loading"], "sample": "We will prepare documents two hours in advance to provide a time buffer for loading. This should reduce idle time at the critical station."}];
let state;try{state=JSON.parse(localStorage.getItem('workflow-v1'))}catch(e){} state=state||{};state.done=state.done||{};state.drafts=state.drafts||{};state.errors=state.errors||[];state.xp=state.xp||0;
let current=null,choice=null,queue=[],filter='All';const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem('workflow-v1',JSON.stringify(state))}catch(e){document.getElementById('storageWarning')?.remove();app.insertAdjacentHTML('beforeend','<p id="storageWarning">Bu ortamda ilerleme kaydedilemiyor. Açık oturumda çalışmaya devam edebilirsin.</p>')}}
function shuffle(a){return a.map(v=>({v,k:Math.random()})).sort((a,b)=>a.k-b.k).map(x=>x.v)}
function home(){current=null;let n=Object.keys(state.done).length;app.innerHTML=`<section class="card hero"><div class="tag">SENİN İŞ GÜNÜN, İNGİLİZCE</div><h2>Bir sevkiyatı kurtar.<br>Bir cümleyi öğren.</h2><p>Müşteriye cevap ver, darboğazı bul ve akışı iyileştir. 15 özgün lojistik senaryosu; internet ve ücretli yapay zekâ gerektirmez.</p><button class="primary" onclick="start()">Vardiyayı başlat →</button></section><div class="stats"><div><b>${state.xp}</b>Deneyim</div><div><b>${n}/15</b>Tamamlanan</div><div><b>${state.errors.length}</b>Tekrar bekleyen</div></div><section class="card"><h3>Bugün ne çalışalım?</h3><label>TOC odağı<select id="filter" onchange="filter=this.value"><option value="All">Tüm senaryolar</option>Identify</option>Exploit</option>Subordinate</option>Elevate</option>Repeat</option></select></label><p>Kararın ardından İngilizce bir durum mesajı yaz. Anahtar ifadeleri, net aksiyonu ve güncelleme zamanını çalış.</p><small>Yazı değerlendirmesi yerel kontrol listesidir; kapsamlı gramer analizi veya yapay zekâ sohbeti değildir. İlerleme bu cihazda saklanır.</small></section>`;document.getElementById('filter').value=filter}
function start(errors=false){queue=shuffle(scenarios.filter(s=>(filter==='All'||s.step===filter)&&(!errors||state.errors.includes(s.id))).map(s=>s.id));if(!errors){queue.sort((a,b)=>Number(!!state.done[a])-Number(!!state.done[b]))}next()}
function next(){if(!queue.length){app.innerHTML='<section class="card hero"><h2>Vardiya tamamlandı ✓</h2><p>Yeni tur açabilir veya yanlış kararlarını tekrar çalışabilirsin.</p><button class="primary" onclick="home()">Merkeze dön</button></section>';return}current=scenarios[queue.shift()];choice=null;render()}
function render(){const s=current;let opts=shuffle(s.options.map((text,index)=>({text,index})));app.innerHTML=`<section class="card"><div class="tag">${esc(s.step)} • ${queue.length+1} SENARYO KALDI</div><h2>${esc(s.title)}</h2><div class="row"><button onclick="speak(current.message)">▶ Dinle</button><button onclick="hint()">İfade ipucu</button></div><p class="message">${esc(s.message)}</p><div id="hint" class="hidden">${s.phrases.map(p=>`<span class="pill">${esc(p)}</span>`).join('')}</div><h3>What would you do next?</h3><div class="options">${opts.map(o=>`<button data-index="${o.index}" onclick="decide(${o.index})">${esc(o.text)}</button>`).join('')}</div><div id="decision"></div></section><section class="card"><h3>Müşteriye yanıtını yaz</h3><small>İngilizce 2–3 cümle: durum + aksiyon + sonraki güncelleme veya beklenen sonuç.</small><textarea id="reply" placeholder="The shipment is currently…" oninput="draft(this.value)">${esc(state.drafts[s.id]||'')}</textarea><div class="row"><button class="primary" onclick="check()">Yanıtı kontrol et</button><button onclick="speak(document.getElementById('reply').value)">Yanıtımı dinle</button></div><div id="writing"></div><details><summary>Örnek yanıtı göster</summary><p>${esc(s.sample)}</p><button onclick="speak(current.sample)">▶ Örneği dinle</button></details></section><button id="next" disabled class="primary" onclick="next()">Sonraki senaryo →</button>`}
function hint(){document.getElementById('hint').classList.toggle('hidden')}
function draft(t){state.drafts[current.id]=t;save()}
function decide(i){if(choice!==null)return;choice=i;let ok=i===current.correct;document.querySelectorAll('[data-index]').forEach(b=>{b.disabled=true;if(+b.dataset.index===current.correct)b.classList.add('good');else if(+b.dataset.index===i)b.classList.add('bad')});if(!state.done[current.id]){state.xp+=ok?20:5;state.done[current.id]=true}if(ok)state.errors=state.errors.filter(id=>id!==current.id);else if(!state.errors.includes(current.id))state.errors.push(current.id);save();document.getElementById('decision').innerHTML=`<div class="feedback"><b>${ok?'Doğru karar ✓':'Bu kararı yeniden düşün'}</b><p>${esc(current.why)}</p></div>`;document.getElementById('next').disabled=false}
function check(){let t=document.getElementById('reply').value.trim();if(!t){document.getElementById('writing').innerHTML='<p>Önce kısa bir İngilizce yanıt yaz.</p>';return}let lower=t.toLowerCase();let found=current.phrases.filter(p=>lower.includes(p));let action=/\b(will|please|propose|request|should|plan|checking|assigned)\b/i.test(t),time=/\b(by|today|tomorrow|hour|week|once|before|after)\b|\d{1,2}:\d{2}/i.test(t);document.getElementById('writing').innerHTML=`<div class="feedback"><b>İletişim kontrol listesi</b><p>${found.length?'✓':'○'} Hedef ifadeler: ${found.length}/${current.phrases.length}<br>${action?'✓':'○'} Aksiyon ifadesi ${action?'bulundu':'eklemeyi dene'}<br>${time?'✓':'○'} Zaman veya koşul ${time?'bulundu':'belirtmeyi dene'}</p><small>Bu kontrol anahtar sözcüklere bakar; anlamın veya gramerin doğru olduğunu garanti etmez. Örnek yanıtla karşılaştır.</small></div>`;draft(t)}
function speak(t){if(!t.trim())return;if(!('speechSynthesis' in window)){alert('Bu ortam seslendirmeyi desteklemiyor. Telefon tarayıcısında deneyebilirsin.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.86;speechSynthesis.speak(u)}
function review(){app.innerHTML=`<section class="card"><h2>Karar tekrarları</h2><p>${state.errors.length?state.errors.length+' senaryoyu tekrar çözerek operasyon kararlarını pekiştir.':'Şu an tekrar bekleyen yanlış karar yok.'}</p>${state.errors.length?'<button class="primary" onclick="filter=&quot;All&quot;;start(true)">Yanlışları çalış →</button>':''}</section><section class="card"><h3>İş İngilizcesi ifade bankası</h3>${[...new Set(scenarios.flatMap(s=>s.phrases))].map(p=>`<button class="pill" onclick="speak(this.textContent)">${esc(p)}</button>`).join('')}<p>Bir ifadeye dokunarak telaffuzunu dinle. İfadeleri senaryolarda cümle içinde kullan.</p></section>`}
function theory(){const steps=[['Identify','Darboğazı belirle','Sistemin hedefini sınırlayan mevcut engeli bul. En uzun kuyruk bir ipucudur; tek başına kesin kanıt değildir.'],['Exploit','Mevcut kapasiteyi iyi kullan','Darboğazın zamanını eksik evrak, gereksiz bekleme ve tekrar işten koru.'],['Subordinate','Diğer işleri uyumla','İş salımını ve öncelikleri darboğazın temposuna göre düzenle; yerel çıktı yerine sistem akışını izle.'],['Elevate','Kapasiteyi artır','Önceki adımlar yetmiyorsa hedefli ek kapasite veya politika değişikliği değerlendir.'],['Repeat','Yeniden belirle','Engel kalktığında yeni darboğazı bul; eski çalışma alışkanlıklarının yeni engel oluşturmasına izin verme.']];app.innerHTML='<section class="card hero"><div class="tag">THEORY OF CONSTRAINTS</div><h2>Akışı sınırlayan yere odaklan.</h2><p>Goldratt’ın TOC yaklaşımından esinlenen özgün eğitim örnekleri. Belirli bir kitabın özeti veya alıntısı değildir.</p></section>'+steps.map((s,i)=>`<section class="card"><div class="tag">0${i+1} • ${s[0]}</div><h3>${s[1]}</h3><p>${s[2]}</p><button onclick="filter='${s[0]}';start()">Bu adımı çalış →</button></section>`).join('')+'<section class="card"><h3>Drum • Buffer • Rope</h3><p><b>Drum:</b> Darboğazın temposu.<br><b>Buffer:</b> Akışı aksamalardan koruyan tampon.<br><b>Rope:</b> Yeni işin sisteme girişini bu tempoya bağlayan mekanizma.</p><p>Bu uygulama temel karar pratiği sunar; gerçek operasyon ölçümleri veya kurumsal sistem bağlantısı içermez.</p><a href="https://www.tocinstitute.org/five-focusing-steps.html" target="_blank" rel="noopener">Kaynak: TOC Institute — Five Focusing Steps</a></section>'}
home();</script></html>
