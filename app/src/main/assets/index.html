<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1c25"><title>WorkFlow • Engineer V10</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color-scheme:dark;--bg:#08171f;--surface:#102630;--card:#13303a;--text:#edf5f3;--muted:#a8c1c7;--line:#29434c;--accent:#a9efc5;--ink:#0c2d27;--gold:#efc685;--red:#ffb0a8;--radius:22px;font-size:16px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}body.light{color-scheme:light;--bg:#f1f5f2;--surface:#fff;--card:#e7f0eb;--text:#102b31;--muted:#4a6570;--line:#c4d6cf;--accent:#176e55;--ink:#fff;--gold:#92621f;--red:#a03936}body.large{font-size:18px}button,input,select,textarea{font:inherit}button{color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:13px 16px;min-height:46px;cursor:pointer;line-height:1.45}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}button:hover{filter:brightness(1.12)}button:disabled{opacity:.65;cursor:default}.primary{background:var(--accent);color:var(--ink);font-weight:750;border-color:transparent}.quiet{background:transparent}.small{padding:8px 12px;font-size:.8em;min-height:40px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.eyebrow{font-size:.66em;letter-spacing:2.1px;text-transform:uppercase;font-weight:750;color:var(--accent)}h1,h2,h3,p{margin-top:0}h1{font-size:1.25em;letter-spacing:-.6px;margin:4px 0}h2{font-size:1.8em;letter-spacing:-1px;line-height:1.13}h3{font-size:1.05em;line-height:1.4}p{line-height:1.65;color:var(--muted)}small,.muted{font-size:.79em;color:var(--muted);line-height:1.65}main{width:100%;max-width:1040px;margin:auto;padding:22px 20px 125px}header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:25px}.brand{display:flex;align-items:center;gap:10px}.mark{display:grid;place-items:center;width:40px;height:42px;background:var(--accent);color:var(--ink);border-radius:14px;font-size:22px;font-weight:900}.badge{border:1px solid var(--line);border-radius:20px;padding:6px 10px;color:var(--muted);font-size:.65em;white-space:nowrap}.hero{background:linear-gradient(125deg,#123e43,#0e292f);border:1px solid #35605e;border-radius:28px;padding:25px;position:relative;overflow:hidden;color:#edf5f3}.hero p{color:#c0d6d6}.hero .eyebrow{color:#b3efc6}.hero h2{font-size:2.3em;max-width:490px;margin:17px 0}.hero button.primary{background:#b2efc9;color:#16372d}.factory{width:100%;height:105px;margin:15px 0 -7px}.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin:15px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid .card{margin:0}.tile{text-align:left;padding:18px;border-radius:20px;min-width:0;position:relative;overflow:hidden;background:var(--surface)}.tile strong{display:block;margin:15px 0 7px;font-size:1.05em}.tile small{display:block}.tile .icon{color:var(--accent);font-size:24px}.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:18px 0}.kpis>div{border:1px solid var(--line);background:var(--surface);padding:15px 10px;border-radius:17px;min-width:0}.kpis b{display:block;font-size:1.55em;letter-spacing:-.5px;margin-bottom:5px}.kpis span{color:var(--muted);font-size:.68em}.section{display:flex;justify-content:space-between;align-items:baseline;margin:27px 0 13px}.section h3{margin:0}.chip{display:inline-block;border:1px solid var(--line);padding:6px 10px;border-radius:20px;font-size:.71em;color:var(--muted);margin:3px 3px 3px 0}.green{color:var(--accent)}.gold{color:var(--gold)}.tagline{font-size:.8em;margin:12px 0 0}.message{color:var(--text);font-size:1.05em;line-height:1.75}.options{display:grid;gap:10px;margin-top:17px}.options button{text-align:left;border-radius:15px;display:flex;gap:12px;align-items:flex-start}.letter{width:26px;height:26px;flex:0 0 26px;border-radius:8px;background:var(--card);display:grid;place-items:center;font-size:.75em}.correct{border-color:var(--accent)!important;background:var(--card)!important}.wrong{border-color:var(--red)!important}.feedback{padding:17px;border-left:3px solid var(--accent);background:var(--card);border-radius:12px;margin-top:18px}.feedback h3{margin-bottom:8px}.feedback p{margin:8px 0}.note{padding:13px 15px;border-left:3px solid var(--gold);background:var(--card);border-radius:10px;font-size:.8em;color:var(--muted);line-height:1.65;margin:15px 0}.meter{height:7px;background:var(--line);border-radius:8px;overflow:hidden}.meter i{height:100%;display:block;background:var(--accent)}label{display:block;font-size:.84em;color:var(--muted);margin:14px 0 7px}input,select,textarea{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:13px;min-height:46px}input[type=range]{padding:8px 0;accent-color:var(--accent)}textarea{height:140px;line-height:1.65;resize:vertical}details{border-top:1px solid var(--line);padding-top:14px;margin-top:16px}summary{cursor:pointer;color:var(--accent);font-size:.85em;line-height:1.6}details p{margin-top:12px;font-size:.88em}nav{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--line);padding:9px 7px max(9px,env(safe-area-inset-bottom));display:flex;justify-content:center;gap:4px;z-index:50}nav button{display:flex;flex-direction:column;gap:4px;align-items:center;border:0;background:transparent;font-size:.63em;padding:8px;min-width:58px;color:var(--muted);min-height:53px}nav button span{font-size:19px;line-height:1}nav button.active{background:var(--card);color:var(--accent)}.hidden{display:none!important}.listbutton{width:100%;display:flex;justify-content:space-between;align-items:center;text-align:left;margin:9px 0;gap:12px}.listbutton b{font-size:.95em}.listbutton small{display:block;margin-top:6px}.number{font-size:2.7em;letter-spacing:-2px;color:var(--accent);line-height:1.2}.statrow{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line);font-size:.84em;gap:12px}.statrow b{text-align:right}.breadcrumb{margin:0 0 15px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 13px}.full{grid-column:1/-1}.result{margin-top:15px;overflow-wrap:anywhere}a{color:var(--accent)}.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);max-width:90%;background:var(--accent);color:var(--ink);padding:12px 18px;border-radius:14px;z-index:99;font-size:.85em;box-shadow:0 8px 30px #0005}svg{max-width:100%}.modelnav{display:flex;gap:7px;flex-wrap:wrap;margin:15px 0}.modelnav button{font-size:.75em;padding:9px 12px}.selected{background:var(--accent)!important;color:var(--ink)!important}.answerNumber{max-width:240px}.moduleline{display:grid;grid-template-columns:35px 1fr;gap:12px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}.moduleline b{font-size:.9em}.moduleline small{display:block}.modnum{border:1px solid var(--line);border-radius:12px;padding:8px;color:var(--accent);text-align:center;font-size:.8em}.choicehead{display:flex;justify-content:space-between;align-items:center;gap:10px}button svg{vertical-align:middle}.filtergrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.filtergrid select{font-size:.82em}.empty{text-align:center;padding:35px 10px}.reportline{padding:15px 0;border-bottom:1px solid var(--line)}.reportline p{font-size:.82em}.keycap{font-size:.7em;color:var(--gold)}@media(min-width:740px){.homegrid{display:grid;grid-template-columns:1.1fr 1fr;gap:20px}.hero{padding:30px}.factory{height:130px}.grid.wide{grid-template-columns:repeat(3,minmax(0,1fr))}main{padding-top:30px}.hero h2{font-size:2.7em}.desktopstack{align-self:start}.kpis{margin-top:0}nav button{min-width:90px}}@media(max-width:370px){main{padding:18px 13px 125px}.hero{padding:20px}.hero h2{font-size:2.05em}.tile{padding:15px}.kpis b{font-size:1.3em}nav button{min-width:51px;padding:7px 6px}.card{padding:17px}.formgrid{gap:0 9px}}@media(prefers-reduced-motion:no-preference){.card,.hero,.tile{animation:appear .22s ease-out}@keyframes appear{from{opacity:.5;transform:translateY(5px)}to{opacity:1;transform:none}}}
header .brand{min-width:0;flex:1}.brand>div:last-child{min-width:0}header h1{font-size:clamp(16px,4.3vw,21px)}header .eyebrow{font-size:.55em;letter-spacing:1.4px}.hero .badge{color:#c0d6d6;border-color:#456563}header>.badge{flex:0 0 auto;font-size:.58em}
.card,.hero,.tile{animation:none}
</style></head><body><main><header><div class="brand"><div class="mark">w.</div><div><div class="eyebrow">ENGINEER EDITION</div><h1>WorkFlow English</h1></div></div><button class="badge" onclick="settings()" aria-label="Ayarlar">V10 • AYARLAR</button></header><div id="app"></div></main><nav id="nav"></nav><div id="toast" role="status" class="toast hidden"></div><script>
const DATA={"cases": [{"id": "log0", "domain": "Lojistik", "level": 1, "title": "Geciken gemi", "story": "The vessel departure has been delayed by 24 hours. The customer asks whether the original delivery date is still achievable. Customs clearance takes two days and has no spare capacity.", "prompt": "What is the best next action?", "options": ["Promise the original delivery date.", "Check customs capacity and revise the delivery estimate.", "Send more containers to the port."], "correct": 1, "explain": "Darboğaz gümrük kapasitesi. Geminin gecikmesini tüm teslim zinciriyle değerlendir; doğrulanmamış tarih vaat etme.", "sample": "The vessel departure has been delayed by 24 hours. We are checking customs capacity and will confirm a revised delivery estimate by 15:00.", "phrases": ["departure", "delivery estimate", "confirm"], "unit": ""}, {"id": "log1", "domain": "Lojistik", "level": 1, "title": "Eksik SI bilgisi", "story": "The documentation team can process 12 shipments per day. Three submissions have missing consignee details. The shipping instruction deadline is 16:00.", "prompt": "What is the best next action?", "options": ["Submit all files even if incomplete.", "Wait until every shipment is ready.", "Validate complete files and request missing details immediately."], "correct": 2, "explain": "Sınırlı dokümantasyon kapasitesini yeniden işleme harcatma. Hazır dosyaları işle, eksikleri ayrı takip et.", "sample": "Three files have missing consignee details. Please provide the missing details by 14:00 so we can submit complete shipping instructions before the deadline.", "phrases": ["missing details", "deadline", "complete"], "unit": ""}, {"id": "log2", "domain": "Lojistik", "level": 1, "title": "Depo kuyruğu", "story": "Picking capacity is 80 pallets per day, but dispatch can load only 50. There are already 100 pallets waiting for dispatch.", "prompt": "What is the best next action?", "options": ["Align picking release with dispatch capacity.", "Increase picking to 100 pallets.", "Measure success only by picking output."], "correct": 0, "explain": "Depo çıkışı 50 paletle sınırlıysa daha fazla toplama kuyruk oluşturur. İş salımını çıkış kapasitesine göre düzenle.", "sample": "Dispatch capacity is 50 pallets per day. We will align picking release with this limit to reduce the backlog and protect urgent orders.", "phrases": ["capacity", "release", "backlog"], "unit": ""}, {"id": "log3", "domain": "Lojistik", "level": 1, "title": "Kapasite artırma", "story": "Loading remains the constraint after appointment scheduling and paperwork preparation have been improved. Demand is consistently above the current capacity.", "prompt": "What is the best next action?", "options": ["Improve an unrelated reporting dashboard.", "Evaluate an additional loading shift.", "Keep releasing unlimited orders."], "correct": 1, "explain": "Mevcut kapasiteyi iyi kullandıktan sonra ek vardiya gibi darboğaz kapasitesini artıran seçenekleri değerlendir.", "sample": "Loading remains our constraint. We propose an additional shift and will evaluate its cost and expected impact on daily dispatch capacity.", "phrases": ["additional shift", "constraint", "evaluate"], "unit": ""}, {"id": "log4", "domain": "Lojistik", "level": 1, "title": "Yeni darboğaz", "story": "An additional loading shift has removed the dispatch queue. Shipments now wait for a single customs reviewer.", "prompt": "What is the best next action?", "options": ["Continue investing only in loading.", "Ignore customs because dispatch improved.", "Reassess the constraint and focus on customs review."], "correct": 2, "explain": "Darboğaz taşınabilir. Önceki iyileştirmeyi otomatik sürdürmek yerine yeni sınırı belirle.", "sample": "The dispatch queue has been cleared. We will reassess the constraint and prioritise customs review to improve end-to-end delivery performance.", "phrases": ["reassess", "customs review", "priority"], "unit": ""}, {"id": "log5", "domain": "Lojistik", "level": 1, "title": "Müşteriye gecikme bildirimi", "story": "Two orders are delayed because export documents have not been approved. The customer requests a status update and a recovery plan.", "prompt": "What is the best next action?", "options": ["Explain the cause, next action and update time.", "Say everything is on track.", "Blame the document team without a plan."], "correct": 0, "explain": "Önce sevkiyatı tutan engeli tanımla. İyi durum mesajı neden, aksiyon ve sonraki güncelleme zamanını içerir.", "sample": "The orders are awaiting export document approval. Our recovery plan is to prioritise the review today. We will send the next update by 16:00.", "phrases": ["approval", "recovery plan", "update"], "unit": ""}, {"id": "log6", "domain": "Lojistik", "level": 1, "title": "Cut-off riski", "story": "The terminal cut-off is 18:00. One truck slot remains. Order A has complete documents and is due today; order B has missing documents and is due next week.", "prompt": "What is the best next action?", "options": ["Send order B because it is larger.", "Assign the slot to order A.", "Leave the slot unused."], "correct": 1, "explain": "Kıt slotu evrakı hazır ve acil siparişe ayır. Bu senaryoda büyüklük, teslim önceliğinden daha önemli değil.", "sample": "We have assigned the remaining truck slot to order A, as its documents are ready and its delivery is due today. This protects the terminal cut-off.", "phrases": ["cut-off", "slot", "ready"], "unit": ""}, {"id": "log7", "domain": "Lojistik", "level": 1, "title": "Günlük toplantı", "story": "A manager wants every department to maximise its own output. Packing can handle 60 units per hour, while upstream teams can produce 100.", "prompt": "What is the best next action?", "options": ["Run all departments at full speed.", "Buy faster upstream equipment.", "Align upstream output with packing capacity."], "correct": 2, "explain": "Yerel verimlilik artışı sistem çıktısını her zaman artırmaz. Bu akışta paketleme temposu diğer ekipleri yönlendirir.", "sample": "Packing is limiting throughput to 60 units per hour. We should align upstream output with packing capacity rather than build excess inventory.", "phrases": ["packing", "throughput", "align"], "unit": ""}, {"id": "log8", "domain": "Lojistik", "level": 1, "title": "Taşıyıcı eskalasyonu", "story": "Only one carrier confirmation is needed to release a priority shipment. The carrier has not replied, and the booking deadline is approaching.", "prompt": "What is the best next action?", "options": ["Escalate the pending confirmation with a clear deadline.", "Send vague reminders to everyone.", "Create duplicate bookings immediately."], "correct": 0, "explain": "Engeli kaldırabilecek kişiye net talep, referans ve süre ilet. Tekrar işlem yaratmadan öncelikli akışı koru.", "sample": "The carrier confirmation is still pending for our priority booking. Please confirm space availability by 13:00 so we can release the shipment before the deadline.", "phrases": ["pending", "confirmation", "booking"], "unit": ""}, {"id": "log9", "domain": "Lojistik", "level": 1, "title": "Gümrük incelemesi", "story": "One customs reviewer handles all declarations. Incomplete files consume half of the reviewer’s day through repeated corrections.", "prompt": "What is the best next action?", "options": ["Send more incomplete files.", "Introduce a completeness check before review.", "Hire more warehouse pickers."], "correct": 1, "explain": "Darboğazın zamanını korumak için ön kontrol uygula. Burada ön kontrol, inceleyicinin tekrar işini azaltır.", "sample": "We will check each declaration for completeness before customs review. This should reduce repeated corrections and protect the reviewer’s available time.", "phrases": ["declaration", "review", "corrections"], "unit": ""}, {"id": "log10", "domain": "Lojistik", "level": 1, "title": "Gerçek ATD", "story": "The customer asks for actual departure time. Your system shows a planned departure only; there is no confirmed departure event.", "prompt": "What is the best next action?", "options": ["Report the planned time as actual.", "Invent an estimated actual departure.", "State that ATD is unconfirmed and request verification."], "correct": 2, "explain": "Planlanan tarih ile gerçekleşen olay farklıdır. Veri doğruluğu engelini açıkça belirt; ATD uydurma.", "sample": "Actual departure has not yet been verified. The system currently shows the planned departure only. We have requested carrier confirmation and will update you once confirmed.", "phrases": ["actual departure", "planned", "verified"], "unit": ""}, {"id": "log11", "domain": "Lojistik", "level": 1, "title": "Teslim önceliği", "story": "There are ten ready loads but only four dispatch slots. Two loads are due today, two tomorrow, and six next week. All loads require one slot.", "prompt": "What is the best next action?", "options": ["Assign slots by delivery urgency.", "Choose whichever customer emails most.", "Release all ten loads to the queue."], "correct": 0, "explain": "Verilen eşit yük koşullarında teslim aciliyetiyle slotları planla. Gerçek işte sözleşme ve operasyon kısıtlarını da kontrol et.", "sample": "We will allocate today’s four dispatch slots to the loads due today and tomorrow. The remaining loads will be scheduled according to delivery urgency.", "phrases": ["urgent", "allocate", "due"], "unit": ""}, {"id": "log12", "domain": "Lojistik", "level": 1, "title": "İyileştirme önerisi", "story": "The documentation queue persists after templates and pre-checks have been introduced. A trained backup reviewer is available for a two-week pilot.", "prompt": "What is the best next action?", "options": ["Start a measured backup-reviewer pilot.", "Remove quality checks.", "Increase incoming files without a plan."], "correct": 0, "explain": "İlk düzenlemeler yetersizse ek kapasiteyi kontrollü pilotla dene. Sonucu sistem akışında ölç.", "sample": "We propose a two-week pilot with a trained backup reviewer. We will measure completed files, turnaround time and error rates before deciding on a permanent change.", "phrases": ["pilot", "backup reviewer", "measure"], "unit": ""}, {"id": "log13", "domain": "Lojistik", "level": 1, "title": "Yönetim özeti", "story": "A process change reduced loading time, but total delivery lead time did not improve. The team needs to explain the result to management.", "prompt": "What is the best next action?", "options": ["Claim the whole system improved.", "Check where shipments now wait.", "Repeat the same loading change indefinitely."], "correct": 1, "explain": "Tek aşamadaki hız artışı uçtan uca iyileşme olmayabilir. Bekleme noktalarını yeniden incele.", "sample": "Loading time has improved, but total delivery lead time remains unchanged. We will analyse where shipments are waiting and target the current constraint.", "phrases": ["lead time", "improvement", "waiting"], "unit": ""}, {"id": "log14", "domain": "Lojistik", "level": 1, "title": "Zaman tamponu", "story": "The critical loading station often waits for documents. Documents should be ready two hours before loading, but are usually delivered at the last minute.", "prompt": "What is the best next action?", "options": ["Prepare documents earlier to protect loading.", "Keep documents until the truck arrives.", "Increase picking speed only."], "correct": 0, "explain": "Zaman tamponu kritik istasyonun aç kalmasını önlemeye yardımcı olur. Tampon süresi bu örnekte varsayımdır.", "sample": "We will prepare documents two hours in advance to provide a time buffer for loading. This should reduce idle time at the critical station.", "phrases": ["buffer", "in advance", "loading"], "unit": ""}, {"id": "ie1", "domain": "TOC", "level": 1, "title": "Hattın ritmi", "story": "Cutting can process 80 units/hour, assembly 50 and packing 70. Each unit visits all stations once; assume no downtime or scrap.", "prompt": "What is the maximum steady flow rate?", "answer": 50, "unit": "adet/saat", "explain": "Seri akışın kapasitesi min(80,50,70)=50. Montaj darboğazdır. Ara stok başlangıçta çıktıyı geçici değiştirebilir.", "sample": "Assembly limits our line to 50 units per hour. We should focus improvement there.", "phrases": ["assembly", "flow rate", "constraint"]}, {"id": "ie2", "domain": "TOC", "level": 2, "title": "Yerel iyileştirme tuzağı", "story": "The same line has capacities of 80, 50 and 70 units/hour. Cutting increases to 100; assembly and packing stay unchanged.", "prompt": "How much does steady line capacity increase?", "answer": 0, "unit": "adet/saat", "explain": "Montaj hâlâ 50 olduğu için tüm hattın kapasite artışı sıfırdır. Yalnızca kesmeyi hızlandırmak çözüm olmaz.", "sample": "Faster cutting does not increase total throughput while assembly remains the constraint.", "phrases": ["throughput", "remains", "capacity"]}, {"id": "ie3", "domain": "TOC", "level": 2, "title": "Kısıt taşınıyor", "story": "Capacities are cutting 80, assembly 50 and packing 70 units/hour. A pilot increases assembly to 75.", "prompt": "What is the new steady line capacity?", "answer": 70, "unit": "adet/saat", "explain": "min(80,75,70)=70. Yeni darboğaz paketlemedir; yeniden belirle adımına dön.", "sample": "Packing becomes the new constraint at 70 units per hour.", "phrases": ["packing", "reassess", "constraint"]}, {"id": "ie4", "domain": "TOC", "level": 2, "title": "Kısıt dakikasının değeri", "story": "Product A sells for 120 TL and has 60 TL of totally variable costs. It uses 10 constraint minutes. Other costs are fixed for this decision.", "prompt": "What is throughput per constraint minute?", "answer": 6, "unit": "TL/dakika", "explain": "Birim throughput=120−60=60 TL; kısıt dakikası başına=60/10=6 TL/dk. Bu, muhasebe birim kârıyla aynı ölçü değildir.", "sample": "Product A generates six lira of throughput per constraint minute.", "phrases": ["throughput", "variable costs", "constraint minute"]}, {"id": "ie5", "domain": "TOC", "level": 3, "title": "Ürün karması", "story": "A generates 60 TL throughput and uses 10 constraint minutes; B generates 45 TL and uses 5 minutes. There are 300 constraint minutes; B demand is capped at 40, A demand is unlimited. Whole units; no setups or other constraints.", "prompt": "After prioritising B, what total throughput is achievable?", "answer": 2400, "unit": "TL", "explain": "B:45/5=9 TL/dk; A:60/10=6 TL/dk. Önce 40 B:200 dk,1800 TL. Kalan100 dk ile10 A:600 TL. Toplam2400 TL. Tek kısıt ve verilen talep varsayımlarıyla sonuç geçerlidir.", "sample": "We will produce 40 units of B and 10 of A, generating 2400 lira of throughput.", "phrases": ["product mix", "prioritise", "remaining capacity"]}, {"id": "ie6", "domain": "Yalın", "level": 1, "title": "Müşteri temposu", "story": "A shift provides 420 net production minutes after planned breaks. Customer demand is 210 units per shift.", "prompt": "What is takt time?", "answer": 2, "unit": "dakika/adet", "explain": "Takt=net kullanılabilir süre/talep=420/210=2 dk/adet. Takt, ölçülen çevrim süresi değildir.", "sample": "Our takt time is two minutes per unit, based on customer demand.", "phrases": ["takt time", "net available time", "demand"]}, {"id": "ie7", "domain": "Yalın", "level": 2, "title": "Hat dengeleme alt sınırı", "story": "Total task content is 18 minutes per unit. Required cycle time is 4 minutes. Ignore precedence and indivisible tasks for the theoretical lower bound.", "prompt": "What is the minimum theoretical number of stations?", "answer": 5, "unit": "istasyon", "explain": "ceil(18/4)=5. Bu yalnızca alt sınırdır; öncelik ve bölünemez işler gerçek ihtiyacı artırabilir.", "sample": "We need at least five stations; precedence constraints may require more.", "phrases": ["line balancing", "precedence", "lower bound"]}, {"id": "ie8", "domain": "Yalın", "level": 2, "title": "Denge verimliliği", "story": "A line has five stations, a four-minute cycle and 18 minutes of total task work per unit.", "prompt": "What is line balance efficiency?", "answer": 90, "unit": "%", "explain": "Verimlilik=iş içeriği/(istasyon×çevrim)=18/(5×4)=0.90. İstasyon kapasitesinin %10’u bu tanıma göre boşta kalır.", "sample": "Line balance efficiency is 90 percent.", "phrases": ["efficiency", "cycle time", "idle time"]}, {"id": "ie9", "domain": "Yalın", "level": 1, "title": "Değer yaratan süre", "story": "A job spends 180 minutes in the process; only 18 minutes are value-adding under the stated classification.", "prompt": "What is process cycle efficiency?", "answer": 10, "unit": "%", "explain": "PCE=değer yaratan süre/toplam akış süresi=18/180=%10. Hedef yalnızca değer yaratan adımı hızlandırmak değildir.", "sample": "Only ten percent of lead time is value-adding; waiting needs investigation.", "phrases": ["value-adding", "lead time", "waiting"]}, {"id": "ie10", "domain": "Kalite", "level": 2, "title": "OEE birlikte düşünülür", "story": "Availability is 90%, performance is 80%, and quality is 95%. These factors use consistent definitions.", "prompt": "What is OEE?", "answer": 68.4, "unit": "%", "explain": "OEE=0.90×0.80×0.95=0.684=%68.4. Yüzdeleri toplama veya ortalama alma.", "sample": "Overall equipment effectiveness is 68.4 percent.", "phrases": ["availability", "performance", "quality"]}, {"id": "ie11", "domain": "Kalite", "level": 1, "title": "İlk seferde doğru", "story": "Of 500 units processed, 460 pass without rework. Repaired units do not count as first-pass successes.", "prompt": "What is first-pass yield?", "answer": 92, "unit": "%", "explain": "FPY=460/500=%92. Sonradan onarılan parçaları ilk seferde doğru sayma.", "sample": "First-pass yield is 92 percent; rework still consumes capacity.", "phrases": ["first-pass yield", "rework", "processed"]}, {"id": "ie12", "domain": "Kalite", "level": 2, "title": "DPMO", "story": "A sample contains 20 defects across 1000 units. Each unit has four defined defect opportunities. Count defects, not defective units.", "prompt": "What is defects per million opportunities?", "answer": 5000, "unit": "DPMO", "explain": "DPMO=20/(1000×4)×1,000,000=5000. Kusur sayısı ile kusurlu ürün sayısı farklıdır.", "sample": "The process has 5000 defects per million opportunities under our opportunity definition.", "phrases": ["defect", "opportunity", "sample"]}, {"id": "ie13", "domain": "Stok", "level": 2, "title": "EOQ denge noktası", "story": "Annual demand is 10000 units, ordering cost is 200 TL/order and annual holding cost is 4 TL/unit. Constant demand, instantaneous replenishment, no shortages or quantity discounts.", "prompt": "What is economic order quantity?", "answer": 1000, "unit": "adet", "explain": "EOQ=√(2DS/H)=√(2×10000×200/4)=1000. Yıllık birimleri tutarlı kullan.", "sample": "The economic order quantity is 1000 units under these assumptions.", "phrases": ["order quantity", "holding cost", "replenishment"]}, {"id": "ie14", "domain": "Stok", "level": 1, "title": "Yeniden sipariş noktası", "story": "Average demand is 40 units/day, lead time is five days and the chosen safety stock is 60 units.", "prompt": "What is the reorder point?", "answer": 260, "unit": "adet", "explain": "ROP=d×L+SS=40×5+60=260. Stok pozisyonu bu seviyeye indiğinde sipariş tetiklenir.", "sample": "We should reorder when inventory position reaches 260 units.", "phrases": ["reorder point", "safety stock", "inventory position"]}, {"id": "ie15", "domain": "Stok", "level": 2, "title": "Güvenlik stoğu", "story": "Daily demand standard deviation is 10 units. Independent daily demands, fixed lead time of four days and z=1.65. Use the normal approximation.", "prompt": "What is safety stock?", "answer": 33, "unit": "adet", "explain": "SS=z×σd×√L=1.65×10×2=33. Teslim süresi değişkenliği bu örnekte yoktur.", "sample": "A safety stock of 33 units is indicated by the given normal approximation.", "phrases": ["standard deviation", "lead time", "safety stock"]}, {"id": "ie16", "domain": "Akış", "level": 2, "title": "Little yasası", "story": "A stable process averages 120 jobs in the system. Average throughput is 30 jobs/hour; use the same system boundaries.", "prompt": "What is mean flow time?", "answer": 4, "unit": "saat", "explain": "L=λW; W=120/30=4 saat. Kuyruk ve hizmet dahil aynı sınırları kullandığından emin ol.", "sample": "Average flow time is four hours for the stated system boundary.", "phrases": ["work in progress", "flow time", "system boundary"]}, {"id": "ie17", "domain": "Akış", "level": 3, "title": "Tek sunuculu bekleme", "story": "Poisson arrivals are 8/hour, independent exponential service capacity is 10/hour, one FCFS server, infinite queue and steady state.", "prompt": "What is expected queue waiting time?", "answer": 24, "unit": "dakika", "explain": "M/M/1:Wq=λ/[μ(μ−λ)]=8/(10×2)=0.4 saat=24 dk. Bu toplam sistem süresi değil, kuyruk beklemesidir.", "sample": "Expected waiting time in the queue is 24 minutes under the M/M/1 assumptions.", "phrases": ["arrival rate", "service rate", "queue"]}, {"id": "ie18", "domain": "Akış", "level": 2, "title": "Kritik kullanım", "story": "An M/M/1 station receives 10 jobs/hour and serves 10 jobs/hour. You are asked for a finite steady-state waiting estimate.", "prompt": "What is the best decision?", "options": ["Report zero because rates match.", "Explain that no finite steady-state mean exists.", "Report one hour by assumption."], "correct": 1, "explain": "ρ=1 sınırında M/M/1 için sonlu kararlı durum ortalaması yoktur. Eşit hızlar rastgele değişkenliği ortadan kaldırmaz.", "sample": "No finite steady-state waiting estimate exists when arrival and service rates are equal.", "phrases": ["steady state", "utilisation", "variability"], "unit": ""}, {"id": "ie19", "domain": "Proje", "level": 2, "title": "Kritik yol", "story": "Path A-B-D takes 3+4+2 days. Path A-C-D takes 3+6+2 days. Tasks can run in parallel where the paths differ; no resource conflicts.", "prompt": "What is project duration?", "answer": 11, "unit": "gün", "explain": "En uzun yol A-C-D:3+6+2=11 gün. Kısa yol9 gündür. Kaynak kısıtı yok varsayılmıştır.", "sample": "The critical path takes eleven days, assuming no resource conflicts.", "phrases": ["critical path", "duration", "parallel"]}, {"id": "ie20", "domain": "Proje", "level": 2, "title": "PERT tahmini", "story": "A task has optimistic time 2 days, most likely time 5 days and pessimistic time 8 days. Use the classic PERT weighted mean.", "prompt": "What is expected task time?", "answer": 5, "unit": "gün", "explain": "PERT E=(a+4m+b)/6=(2+20+8)/6=5 gün. Bu proje bitiş garantisi değildir.", "sample": "The PERT expected duration is five days.", "phrases": ["optimistic", "most likely", "expected duration"]}, {"id": "ie21", "domain": "TOC", "level": 2, "title": "Set-up kaybı", "story": "A constrained machine has 480 available minutes. Four changeovers each take 30 minutes. A pilot reduces each changeover to 15 minutes; all else is unchanged.", "prompt": "How many constraint minutes are recovered?", "answer": 60, "unit": "dakika", "explain": "4×(30−15)=60 dakika. Bu sürenin satış kazancına dönüşmesi talep ve diğer kısıtlara bağlıdır.", "sample": "We can recover sixty constraint minutes by reducing changeover time.", "phrases": ["changeover", "recover", "constraint"]}, {"id": "ie22", "domain": "Kalite", "level": 2, "title": "Kontrol sınırı ne söyler?", "story": "A control chart has a point above its upper control limit. The customer specification limit is a different value.", "prompt": "What is the best decision?", "options": ["Treat the two limits as identical.", "Investigate a possible special cause; assess specifications separately.", "Widen the control limits to hide the point."], "correct": 1, "explain": "Kontrol sınırı süreç davranışı; spesifikasyon müşteri gereğidir. Özel neden sinyalini araştır, ikisini karıştırma.", "sample": "We will investigate a possible special cause and assess specification compliance separately.", "phrases": ["control limit", "specification", "special cause"], "unit": ""}, {"id": "ie23", "domain": "TOC", "level": 3, "title": "Çatışan ihtiyaçlar", "story": "Sales needs customer responsiveness; production needs manageable WIP. Both want reliable delivery. The conflict is release-all versus controlled release.", "prompt": "What is the best decision?", "options": ["Choose a department and ignore the other.", "Challenge the assumption that responsiveness requires immediate release of every order.", "Increase WIP without measuring lead time."], "correct": 1, "explain": "Ortak hedef→ihtiyaçlar→çatışan eylemler→varsayım. Kontrollü salım + açık müşteri görünürlüğü iki ihtiyacı birlikte karşılayabilir.", "sample": "We can protect responsiveness through clear commitments rather than releasing every order immediately.", "phrases": ["shared goal", "assumption", "controlled release"], "unit": ""}, {"id": "ie24", "domain": "Yalın", "level": 2, "title": "Kanban neyi çözmez?", "story": "A team wants to add Kanban cards without checking demand, replenishment lead time or container quantity.", "prompt": "What is the best decision?", "options": ["Issue unlimited cards.", "Calculate and validate the replenishment loop before setting the card count.", "Assume Kanban removes all variability."], "correct": 1, "explain": "Kanban sayısı talep, ikmal süresi, kap büyüklüğü ve tampon politikasına bağlıdır. Kartlar sınırsız iş salımı anlamına gelmez.", "sample": "We need to validate demand and replenishment lead time before setting the Kanban limit.", "phrases": ["kanban", "replenishment loop", "container quantity"], "unit": ""}, {"id": "ie25", "domain": "Stok", "level": 2, "title": "Basit Kanban sayısı", "story": "Demand is 20 units/hour; replenishment lead time is two hours. A 10% safety factor is chosen and each container holds 10 units. Round up.", "prompt": "How many Kanban cards are needed?", "answer": 5, "unit": "kart", "explain": "N=ceil[d×L×(1+α)/C]=ceil(20×2×1.10/10)=ceil(4.4)=5. Bu basit modelin varsayımları pilotta doğrulanmalıdır.", "sample": "The simplified calculation calls for five Kanban cards.", "phrases": ["safety factor", "round up", "kanban"]}], "terms": [["constraint", "kısıt / darboğaz", "Assembly is the current constraint."], ["throughput", "TOC: satıştan yaratılan kazanç hızı", "We should compare throughput per constraint minute."], ["bottleneck", "akışı sınırlayan kapasite noktası", "Packing is the bottleneck."], ["work in progress", "süreç içindeki işler / yarı mamul", "Excess work in progress increases waiting."], ["lead time", "başlangıçtan tamamlanmaya geçen süre", "Lead time includes waiting."], ["cycle time", "bir çevrimin gerçekleşen süresi", "The measured cycle time is above takt."], ["takt time", "müşteri talebine göre gereken üretim temposu", "Our takt time is two minutes per unit."], ["changeover", "ürün / iş değişim ayarı", "We should reduce changeover losses."], ["rework", "yeniden işleme", "Rework consumes constraint capacity."], ["first-pass yield", "ilk seferde doğru ürün oranı", "First-pass yield has improved."], ["availability", "kullanılabilirlik", "Downtime reduces availability."], ["performance", "performans / hız etkeni", "Small stops affect performance."], ["quality rate", "sağlam ürün oranı", "Quality rate is part of OEE."], ["replenishment", "ikmal", "Replenishment lead time is two hours."], ["holding cost", "stok taşıma maliyeti", "Annual holding cost is four lira per unit."], ["ordering cost", "sipariş başına maliyet", "Ordering cost affects EOQ."], ["safety stock", "güvenlik stoğu", "Safety stock protects against uncertainty."], ["reorder point", "yeniden sipariş noktası", "The reorder point is 260 units."], ["inventory position", "eldeki + siparişteki − karşılanmamış talep", "We reorder based on inventory position."], ["arrival rate", "geliş hızı", "Arrival rate exceeds service capacity."], ["service rate", "hizmet hızı", "The service rate is ten jobs per hour."], ["steady state", "kararlı durum", "Steady state requires a stable model."], ["variability", "değişkenlik", "Variability increases queueing."], ["utilisation", "kapasite kullanım oranı", "High utilisation can increase waiting."], ["root cause", "kök neden", "We should verify the root cause."], ["assumption", "varsayım", "Let us challenge this assumption."], ["shared goal", "ortak hedef", "Reliable delivery is our shared goal."], ["controlled release", "kontrollü iş salımı", "Controlled release limits excess WIP."], ["critical path", "kritik yol", "The critical path determines the earliest finish."], ["precedence", "öncelik / ardışıklık ilişkisi", "Precedence constraints affect balancing."], ["capacity", "kapasite", "Demand exceeds available capacity."], ["due date", "termin / teslim tarihi", "We prioritise orders by due date."], ["backlog", "birikmiş işler", "The backlog is decreasing."], ["escalate", "üst sorumluya taşımak", "We need to escalate the approval delay."], ["recovery plan", "toparlanma / telafi planı", "We will share a recovery plan today."], ["cut-off", "son kabul zamanı", "We must meet the terminal cut-off."], ["special cause", "özel neden", "This point may indicate a special cause."], ["specification", "spesifikasyon / gereklilik", "Control limits are not specification limits."], ["pilot", "sınırlı deneme uygulaması", "We propose a two-week pilot."], ["trade-off", "bir yarar için başka yarardan ödün", "We should test the assumed trade-off."]], "lessons": [["TOC", "Sistemi bir bütün olarak gör", "Bir istasyonun meşgul olması sistemin hedefe ilerlediğini garanti etmez. Seri hatta en düşük etkin kapasite akışı sınırlayabilir.", "Kapasiteler 80 → 50 → 70 ise montajı incele.", "Our goal is to improve end-to-end performance."], ["TOC", "Beş odaklanma adımı", "Belirle → mevcut kısıtı iyi kullan → diğer işleri ona uyumla → gerekirse kısıtı yükselt → yeniden belirle. Yeni yatırım öncesi kayıp zamanı ve iş salımını incele.", "Eksik evrakı kısıt istasyonuna gelmeden kontrol et.", "We should exploit the current constraint before adding capacity."], ["TOC", "Drum • Buffer • Rope", "Drum kısıtın temposu, buffer akışı koruyan tampon, rope yeni iş salımını bu tempoya bağlayan mekanizmadır. Tampon her yerde stok artırmak demek değildir.", "Paketlemeye hazır evrak tamponu oluştur; gereksiz yarı mamulü sınırlı tut.", "We will align releases with the constraint schedule."], ["TOC", "Kök nedeni doğrula", "Eksik veri → tekrar iş → bekleme → kaçan teslim. Her neden-sonuç bağı doğrulanması gereken bir hipotezdir. Korelasyon tek başına neden değildir.", "Son on gecikmede evrak eksikliği ve bekleme sürelerini karşılaştır.", "We need evidence to validate the causal link."], ["TOC", "Çatışma bulutu", "Ortak hedefi, iki ihtiyacı ve çatışan eylemleri ayır. Sonra çatışmayı zorunlu gösteren varsayımı sorgula. Her çatışmayı tek bir uzlaşmayla çözmek zorunda değilsin.", "Hızlı hizmet için bütün siparişler hemen üretime salınmalı mı?", "Can we meet both needs by changing the release policy?"], ["TOC", "Kısıt dakikası ve ürün karması", "Throughput = satış geliri − tamamen değişken maliyetler. Tek kapasite kısıtı örneklerinde kısıt dakikası başına katkı karar desteği sağlar. Çok kısıt, tam sayı veya set-up varsa basit sıralama tek başına optimal sonuç garantilemez.", "Birimi daha kârlı görünen A, kısıtı iki kat uzun kullanıyor olabilir.", "We should evaluate throughput per constraint minute."], ["Yalın", "Takt ve çevrim farkı", "Takt, net süre / müşteri talebidir. Çevrim gerçekleşen iş temposudur. Çevrim takttan büyükse talebi karşılama riski vardır; değişkenlik ve kayıpları da incele.", "420 dk / 210 adet = 2 dk/adet takt.", "Our cycle time needs to support customer takt."], ["Kalite", "OEE ve ilk seferde doğru", "OEE = kullanılabilirlik × performans × kalite. FPY ise yeniden işleme olmadan geçen ürün oranıdır. Tek bir gösterge her karar için yeterli değildir.", "%90 × %80 × %95 = %68.4 OEE.", "We should identify the largest loss before choosing an action."], ["Stok", "EOQ, ROP ve belirsizlik", "EOQ sipariş ve taşıma maliyetini dengeler. ROP teslim süresindeki talep + güvenlik stoğudur. EOQ temel modeli sabit talep ve anlık ikmal gibi güçlü varsayımlar içerir.", "Yıllık ve günlük birimleri aynı hesapta doğrudan karıştırma.", "We must align units and validate the replenishment assumptions."], ["Akış", "Little yasası ve kuyruk", "L = λW aynı sistem sınırlarında uzun dönem ortalamalarını bağlar. M/M/1 ek dağılım varsayımları ister; λ ≥ μ olduğunda sonlu kararlı durum ortalaması yoktur.", "120 iş / 30 iş/saat = 4 saat sistem süresi.", "High utilisation leaves little room for variability."], ["Proje", "Kritik yol ve kaynak kısıtı", "Kritik yol, verilen bağımlılık ağındaki en uzun yoldur. Kaynak paylaşımı ve belirsizlik süreyi değiştirebilir. Kritik yol ile TOC kritik zincir aynı yöntem değildir.", "A-C-D 11 günse 9 günlük A-B-D yolunu hızlandırmak tek başına proje süresini azaltmayabilir.", "We should protect the critical path and check resource conflicts."], ["İletişim", "İyileştirmeyi kabul ettir", "Neyi değiştireceğiz? Neye dönüştüreceğiz? Nasıl? Durum, kanıt, öneri, sorumlu, süre ve ölçüm belirt. İş İngilizcesinde kesin olmayan tarihi kesin vaat gibi sunma.", "We propose… We will measure… The next update will be…", "We propose a measured pilot rather than an unverified commitment."]], "campaigns": [{"id": "factory", "title": "Fabrika dönüşümü", "subtitle": "Bir vardiyada sistemin tamamını iyileştir.", "turns": [["08:00", "Darboğazı bul", "Cutting: 80 units/hour. Assembly: 50. Packing: 70. All orders follow this route. Where should you focus first?", ["Cutting, because it is fastest.", "Assembly, because it limits the serial flow.", "Packing, because it is last."], 1, "Montaj 50 ile hattı sınırlar.", "Assembly is the current constraint at fifty units per hour."], ["09:00", "Kısıt zamanını koru", "Assembly loses 30 minutes each shift searching for components. A ready-parts checklist is available.", ["Introduce the ready-parts checklist.", "Release more incomplete kits.", "Buy a faster cutting machine first."], 0, "Ön hazırlık kısıtı aç kalmaktan korur; mevcut kaybı azalt.", "We will prepare complete kits before assembly to ı dinle</button></div><div id="englishFeedback" aria-live="polite"></div><details id="sample" class="hidden"><summary>Örnek İngilizce açıklama</summary><p>${esc(c.sample)}</p><button class="small" onclick="speak(current.sample)">▶ Örneği dinle</button></details><details><summary>Cümle kurma desteği</summary><p><b>Durum:</b> We have identified…<br><b>Öneri:</b> We propose… / We should…<br><b>Gerekçe:</b> This should reduce…<br><b>Ölçüm:</b> We will measure…<br><b>Zaman:</b> We will update you by…</p></details></section><section class="card"><label for="personalNote">Kendi çözüm notun</label><textarea id="personalNote" oninput="state.notes[current.id]=this.value;save()" placeholder="Bu problemde neyi farklı öğrendim?">${esc(state.notes[c.id]||'')}</textarea></section><button class="primary" onclick="nextCase()">Sonraki problem →</button>`}

let selectedCampaign='factory';function journey(){navigate('journey');app.innerHTML=`<div class="eyebrow">KARARLARININ SONUCU VAR</div><h2 style="margin-top:13px">Bir vardiyada<br>sistemi değiştir.</h2><p>Her karar performans puanını ve eğitim amaçlı iş birikimi göstergesini değiştirir. Kaldığın yer otomatik saklanır.</p>${DATA.campaigns.map((c,i)=>{let st=state.campaigns[c.id];return `<section class="card"><span class="chip">${c.turns.length} karar</span><span class="chip">${i?'LOJİSTİK':'ÜRETİM & TOC'}</span><h3 style="margin:14px 0 8px">${c.title}</h3><p>${c.subtitle}</p><button class="primary" onclick="campaign('${c.id}')">${st?(st.finished?'Raporu gör':'Vardiyaya devam et'):'Vardiyayı başlat'} →</button></section>`}).join('')}<p class="note">Bu vardiyalar açıkça tanımlanmış sonuç puanları kullanır. Sayısal kuyruk modelini Araçlar bölümünde ayrı incele.</p>`}
function campaign(id){selectedCampaign=id;let cfg=DATA.campaigns.find(c=>c.id===id);if(!cfg)return;if(!state.campaigns[id])state.campaigns[id]={index:0,score:0,backlog:12,history:[],finished:false,awarded:false};renderTurn()}
function renderTurn(){navigate('journey');let c=state.campaigns[selectedCampaign],cfg=DATA.campaigns.find(x=>x.id===selectedCampaign);if(c.finished){campaignReport();return}let t=cfg.turns[c.index];app.innerHTML=`<button class="quiet small breadcrumb" onclick="journey()">← Vardiyalar</button><section class="hero"><div class="eyebrow">${esc(cfg.title)} • ${t[0]}</div><h2>${esc(t[1])}</h2><div class="meter"><i style="width:${c.index/cfg.turns.length*100}%"></i></div><p class="tagline">${c.index+1}/${cfg.turns.length} karar • ${c.score} puan • ${c.backlog} birikim göstergesi</p></section><section class="card"><p class="message">${esc(t[2])}</p><button class="small" onclick="speak(DATA.campaigns.find(x=>x.id===selectedCampaign).turns[state.campaigns[selectedCampaign].index][2])">▶ Durumu dinle</button><div class="options">${shuffle(t[3].map((tx,i)=>({tx,i}))).map((o,k)=>`<button data-turn-choice="${o.i}" onclick="turnAct(${o.i})"><span class="letter">${String.fromCharCode(65+k)}</span>${esc(o.tx)}</button>`).join('')}</div><div id="turnFeedback" aria-live="polite"></div></section>`;if(c.locked)showTurnResult()}
function turnAct(i){let c=state.campaigns[selectedCampaign],cfg=DATA.campaigns.find(x=>x.id===selectedCampaign);if(c.locked||c.finished)return;let t=cfg.turns[c.index],ok=i===t[4];c.locked=true;c.choice=i;c.score+=ok?20:0;c.backlog=Math.max(0,c.backlog+(ok?-2:3));c.history.push({ok,title:t[1],explain:t[5],sample:t[6],draft:''});save();showTurnResult()}
function showTurnResult(){let c=state.campaigns[selectedCampaign],last=c.history[c.history.length-1],cfg=DATA.campaigns.find(x=>x.id===selectedCampaign),t=cfg.turns[c.index];document.querySelectorAll('[data-turn-choice]').forEach(b=>{b.disabled=true;if(+b.dataset.turnChoice===t[4])b.classList.add('correct');else if(+b.dataset.turnChoice===c.choice)b.classList.add('wrong')});$('turnFeedback').innerHTML=`<div class="feedback"><h3>${last.ok?'Akışı koruyan karar ✓':'Bu kararı yeniden değerlendir'}</h3><p>${esc(last.explain)}</p><p class="muted">Birikim göstergesi: ${c.backlog}. Bu değer öğretici puanlamadır.</p><label for="turnDraft">Ekibe İngilizce mesajın</label><textarea id="turnDraft" oninput="saveTurnDraft(this.value)" placeholder="We have identified… We propose…">${esc(last.draft)}</textarea><details><summary>Örnek iş mesajı</summary><p>${esc(last.sample)}</p><button class="small" onclick="speak(state.campaigns[selectedCampaign].history.at(-1).sample)">▶ Örneği dinle</button></details><button class="primary" style="margin-top:17px" onclick="turnNext()">Vardiyaya devam →</button></div>`}
function saveTurnDraft(v){let c=state.campaigns[selectedCampaign];c.history[c.history.length-1].draft=v;save()}
function turnNext(){let c=state.campaigns[selectedCampaign],cfg=DATA.campaigns.find(x=>x.id===selectedCampaign);if(!c.locked||c.finished)return;c.locked=false;c.index++;if(c.index===cfg.turns.length){c.finished=true;if(!c.awarded){state.xp+=c.score;c.awarded=true}}save();renderTurn()}
function campaignReport(){let c=state.campaigns[selectedCampaign],cfg=DATA.campaigns.find(x=>x.id===selectedCampaign);app.innerHTML=`<section class="hero"><div class="eyebrow">VARDİYA SONU • ${cfg.title}</div><h2>${c.score>=cfg.turns.length*15?'Sistemi birlikte iyileştirdin.':'Her kararda yeni bir bakış.'}</h2><div class="number" style="color:#b2efc9">${c.score}/${cfg.turns.length*20}</div><p>Karar puanı • ${c.history.filter(x=>x.ok).length}/${cfg.turns.length} doğru</p></section><section class="card">${c.history.map(x=>`<div class="reportline"><b>${x.ok?'✓':'↻'} ${esc(x.title)}</b><p>${esc(x.explain)}</p>${x.draft?`<small>Mesajın: ${esc(x.draft)}</small>`:''}</div>`).join('')}</section><div class="row"><button class="primary" onclick="restartCampaign()">Yeni tur başlat</button><button onclick="journey()">Vardiyalar</button></div><p class="muted">Aynı senaryoda daha önce kazanılan puanlar yeni turda tekrar verilmez.</p>`}
function restartCampaign(){let c=state.campaigns[selectedCampaign];let awarded=c.awarded;state.campaigns[selectedCampaign]={index:0,score:0,backlog:12,history:[],finished:false,awarded};save();renderTurn()}
const toolDefs={takt:{name:'Takt & kapasite',fields:[['time','Net süre (dk/vardiya)',420],['demand','Talep (adet/vardiya)',210],['cycle','Ölçülen çevrim (dk/adet)',2.5]],note:'Takt=net süre/talep. Basit kapasite=net süre/çevrim. Çevrim örneğinde ek duruş ve kalite kaybı yok kabul edilir.'},oee:{name:'OEE',fields:[['a','Kullanılabilirlik (%)',90],['p','Performans (%)',80],['q','Kalite (%)',95]],note:'OEE=A×P×Q. Üç oran da aynı ölçüm dönemi ve tutarlı tanımları kullanmalıdır.'},eoq:{name:'EOQ',fields:[['d','Yıllık talep (adet/yıl)',10000],['s','Sipariş maliyeti (TL/sipariş)',200],['h','Yıllık taşıma (TL/adet/yıl)',4]],note:'Sabit bilinen talep, sabit sipariş/taşıma maliyeti, anlık ikmal, stoksuz kalmama ve miktar indirimi olmaması varsayılır.'},rop:{name:'ROP',fields:[['d','Ortalama talep (adet/gün)',40],['l','Teslim süresi (gün)',5],['ss','Güvenlik stoğu (adet)',60]],note:'ROP=d×L+SS. Teslim süresi ile talebin zaman birimi aynı olmalı; tetikleme stok pozisyonuna göre yapılır.'},little:{name:'Little yasası',fields:[['wip','Sistemde ortalama iş (adet)',120],['rate','Ortalama çıktı (adet/saat)',30]],note:'L=λW. Uzun dönem ortalamaları, tutarlı sistem sınırları ve kararlı bir süreç kullanılır. Süre hizmeti ve beklemeyi içerebilir.'},queue:{name:'M/M/1 kuyruk',fields:[['a','Geliş λ (iş/saat)',8],['m','Hizmet μ (iş/saat)',10]],note:'Poisson geliş, bağımsız üstel hizmet, tek FCFS sunucu, sınırsız kuyruk/nüfus ve kararlı durum. Sonlu ortalama için λ<μ.'},mix:{name:'İki ürün karması',fields:[['ta','A: birim throughput (TL)',60],['ma','A: kısıt süresi (dk)',10],['da','A: azami talep (adet)',100],['tb','B: birim throughput (TL)',45],['mb','B: kısıt süresi (dk)',5],['db','B: azami talep (adet)',40],['cap','Kısıt kapasitesi (dk)',300]],note:'Tam sayılı iki ürün için olası A miktarları taranır; her A için uygun B seçilir. Tek kısıt, pozitif throughput, set-up yok. En çok 10.000 A adayı; çok kısıtlı genel optimizasyon çözmez.'},kanban:{name:'Kanban',fields:[['d','Talep (adet/saat)',20],['l','İkmal süresi (saat)',2],['s','Güvenlik faktörü (%)',10],['c','Kap büyüklüğü (adet)',10]],note:'N=ceil[d×L×(1+α)/C]. Talep, ikmal süresi ve seçilen güvenlik faktörünün uygunluğu uygulamada doğrulanmalıdır.'}};
let selectedTool='takt';function tools(id=selectedTool){selectedTool=typeof id==='string'&&toolDefs[id]?id:'takt';navigate('tools');let d=toolDefs[selectedTool];app.innerHTML=`<div class="eyebrow">MÜHENDİSLİK TEZGAHI</div><h2 style="margin-top:13px">Varsayımı bil.<br>Sonucu ölç.</h2><div class="modelnav">${Object.entries(toolDefs).map(([id,x])=>`<button class="${id===selectedTool?'selected':''}" onclick="tools('${id}')">${x.name}</button>`).join('')}</div><section class="card"><h3>${d.name}</h3><div class="formgrid">${d.fields.map(([id,tx,val])=>`<div><label for="f_${id}">${tx}</label><input type="number" step="any" id="f_${id}" value="${val}"></div>`).join('')}</div><button class="primary" style="margin-top:18px" onclick="calculate()">Hesapla →</button><div id="calcResult" class="result" aria-live="polite"></div><details open><summary>Varsayımlar ve birimler</summary><p>${d.note}</p></details></section>`;calculate()}
function compute(id,v){const invalid=t=>({error:t});let vals=Object.values(v);if(vals.some(n=>!Number.isFinite(n)||n<0||n>1e9))return invalid('Alanlara 0–1 milyar arasında sonlu sayılar gir.');switch(id){case'takt':if(v.time<=0||v.demand<=0||v.cycle<=0)return invalid('Süre, talep ve çevrim sıfırdan büyük olmalı.');return {value:v.time/v.demand,unit:'dk/adet • takt',lines:[['Teorik kapasite',(v.time/v.cycle).toFixed(1)+' adet/vardiya'],['Talebe uyum',v.cycle<=v.time/v.demand?'Çevrim takt sınırında veya altında':'Çevrim takttan büyük; kapasite riski']],formula:'Takt = net süre / talep',english:'We should compare actual cycle time with customer takt.'};case'oee':if([v.a,v.p,v.q].some(n=>n>100))return invalid('OEE oranları %0–100 aralığında olmalı.');return {value:v.a*v.p*v.q/10000,unit:'% OEE',formula:'OEE = (A/100) × (P/100) × (Q/100)',english:'We should identify which loss most affects system performance.'};case'eoq':if(v.d<=0||v.s<=0||v.h<=0)return invalid('Talep ve maliyetler sıfırdan büyük olmalı.');return {value:Math.sqrt(2*v.d*v.s/v.h),unit:'adet • EOQ',lines:[['Yaklaşık sipariş/yıl',(v.d/Math.sqrt(2*v.d*v.s/v.h)).toFixed(2)]],formula:'EOQ = √(2DS/H)',english:'This order quantity balances ordering and holding costs under the stated assumptions.'};case'rop':return {value:v.d*v.l+v.ss,unit:'adet • ROP',formula:'ROP = günlük talep × teslim günü + güvenlik stoğu',english:'We should reorder based on inventory position, not just on-hand stock.'};case'little':if(v.rate<=0)return invalid('Çıktı hızı sıfırdan büyük olmalı.');return {value:v.wip/v.rate,unit:'saat • ortalama akış süresi',formula:'W = L / λ',english:'We must use consistent system boundaries for WIP and throughput.'};case'queue':if(v.m<=0)return invalid('Hizmet hızı sıfırdan büyük olmalı.');if(v.a>=v.m)return {unstable:true,message:'λ ≥ μ: Sonlu kararlı durum ortalaması yok. Bekleme için sonlu sayı raporlanamaz.'};let rho=v.a/v.m;return {value:60*v.a/(v.m*(v.m-v.a)),unit:'dakika • kuyrukta bekleme',lines:[['Kullanım',(rho*100).toFixed(1)+'%'],['Kuyruktaki ortalama iş',(rho*rho/(1-rho)).toFixed(2)],['Toplam sistem süresi',(60/(v.m-v.a)).toFixed(2)+' dk']],formula:'Wq = λ / [μ(μ−λ)] saat',english:'Queue waiting increases sharply as utilisation approaches one.'};case'mix':if(v.ma<=0||v.mb<=0||v.ta<=0||v.tb<=0)return invalid('Süreler ve birim throughput değerleri sıfırdan büyük olmalı.');if(!Number.isInteger(v.da)||!Number.isInteger(v.db))return invalid('Talep adetleri tam sayı olmalı.');let maxA=Math.min(v.da,Math.floor(v.cap/v.ma));if(maxA>10000)return invalid('Bu araç en fazla 10.000 A adayını tarar. Talep veya kapasiteyi azalt.');let best={ta:0,tb:0,value:0};for(let a=0;a<=maxA;a++){let b=Math.min(v.db,Math.floor((v.cap-a*v.ma+1e-9)/v.mb));let value=a*v.ta+b*v.tb;if(value>best.value)best={ta:a,tb:b,value}}return {value:best.value,unit:'TL • toplam throughput',lines:[['Ürün A',best.ta+' adet'],['Ürün B',best.tb+' adet'],['Kullanılan kısıt',(best.ta*v.ma+best.tb*v.mb).toFixed(2)+' dk']],formula:'max(TA × A + TB × B); mA×A + mB×B ≤ kapasite',english:'This is an integer optimum for the stated two-product, single-constraint model.'};case'kanban':if(v.c<=0)return invalid('Kap büyüklüğü sıfırdan büyük olmalı.');return {value:Math.ceil(v.d*v.l*(1+v.s/100)/v.c),unit:'kart',formula:'N = ceil[d × L × (1+α) / C]',english:'The card count must be validated against actual replenishment performance.'}}return invalid('Bilinmeyen model.')}
const rawCompute=compute;compute=function(id,v){let r=rawCompute(id,v);if(r.value!==undefined&&!Number.isFinite(r.value))return {error:'Sonuç sayısal sınırı aşıyor. Birimleri ve girdi büyüklüklerini kontrol et.'};return r};
function calculate(){let vals={};for(let [id]of toolDefs[selectedTool].fields){let raw=$('f_'+id).value;vals[id]=raw.trim()===''?NaN:Number(raw)}let r=compute(selectedTool,vals);$('calcResult').innerHTML=r.error?`<div class="note">${esc(r.error)}</div>`:r.unstable?`<div class="note">${esc(r.message)}</div>`:`<div class="feedback"><div class="number">${Number.isInteger(r.value)?r.value:r.value.toFixed(2)}</div><p>${r.unit}</p>${(r.lines||[]).map(([a,b])=>`<div class="statrow"><span>${a}</span><b>${b}</b></div>`).join('')}<p class="muted">${r.formula}</p><p class="message">${r.english}</p></div>`}
function learn(){navigate('learn');app.innerHTML=`<div class="eyebrow">MÜHENDİSLİK AKADEMİSİ</div><h2 style="margin-top:13px">Önce anla.<br>Sonra uygulamayı değiştir.</h2><div class="row"><button class="small" onclick="words()">Aa • İngilizce ifadeler</button><button class="small" onclick="stats()">Gelişim raporu →</button></div><div class="section"><h3>12 kısa ders</h3><span class="muted">${state.read.length} okundu</span></div>${DATA.lessons.map((l,i)=>`<button class="listbutton" onclick="lesson(${i})"><span class="row"><span class="modnum">${String(i+1).padStart(2,'0')}</span><span><b>${esc(l[1])}</b><small>${l[0]}</small></span></span><span class="green">${state.read.includes(i)?'✓':'→'}</span></button>`).join('')}<details><summary>Kaynak çerçevesi ve kapsam</summary><p>Goldratt’ın <i>What Is This Thing Called Theory of Constraints and How Should It Be Implemented?</i> kitabındaki yaklaşım ve TOC düşünme araçlarından esinlenen özgün örnekler. Kitabın tam metni veya alıştırmaları kopyalanmadı. Kuyruk notları kullanıcının paylaştığı Birth–Death Processes ders içeriğiyle de ilişkilendirildi.</p><p><a href="https://www.toc-goldratt.com/en/about-toc">Goldratt • TOC</a><br><a href="https://www.lean.org/lexicon-terms/takt-time/">Lean Enterprise Institute • Takt</a><br><a href="https://www.oee.com/calculating-oee/">Vorne • OEE</a></p></details>`}
function lesson(i){navigate('learn');let l=DATA.lessons[i];app.innerHTML=`<button class="quiet small breadcrumb" onclick="learn()">← Akademi</button><section class="hero"><div class="eyebrow">DERS ${i+1} / 12 • ${l[0]}</div><h2>${l[1]}</h2></section><section class="card"><h3>Temel fikir</h3><p>${l[2]}</p><div class="note">${l[3]}</div><h3>İş İngilizcesi</h3><p class="message">${l[4]}</p><button class="small" onclick="speak(DATA.lessons[${i}][4])">▶ Cümleyi dinle</button></section><div class="row"><button class="primary" onclick="markLesson(${i})">${state.read.includes(i)?'Okundu ✓':'Okudum ve anladım'}</button><button onclick="domain='${l[0]==='İletişim'?'Lojistik':l[0]}';only='all';level=0;cases()">İlgili problemler →</button></div>`}
function markLesson(i){if(!state.read.includes(i)){state.read.push(i);state.xp+=10;save()}toast('Ders ilerlemene eklendi.');lesson(i)}
function words(all=false){navigate('learn');wordOrder=shuffle(all?DATA.terms.map((_,i)=>i):dueCards());wordPos=0;renderWord()}
function renderWord(){wordFlipped=false;if(wordPos>=wordOrder.length){app.innerHTML=`<section class="hero"><div class="eyebrow">İFADE ANTRENMANI</div><h2>Bu tur tamamlandı.</h2><p>Şu an zamanı gelen ${dueCards().length} kart var. İstersen bütün ifadeleri serbest çalış.</p><div class="row"><button class="primary" onclick="words(true)">Tüm ifadeleri çalış</button><button onclick="home()">Merkez</button></div></section>`;return}let i=wordOrder[wordPos],w=DATA.terms[i];app.innerHTML=`<button class="quiet small breadcrumb" onclick="learn()">← Akademi</button><section class="hero"><div class="eyebrow">İŞ İNGİLİZCESİ • ${wordPos+1}/${wordOrder.length}</div><h2>${esc(w[0])}</h2><p>Türkçe anlamını ve işte kullanacağın bir cümleyi hatırla.</p><div class="row"><button class="primary" id="revealWord" onclick="flipWord()">Anlamı göster</button><button onclick="speak(DATA.terms[wordOrder[wordPos]][0])">▶ Telaffuz</button></div></section><section id="wordAnswer" class="card hidden"><h3>${esc(w[1])}</h3><p class="message">${esc(w[2])}</p><button class="small" onclick="speak(DATA.terms[wordOrder[wordPos]][2])">▶ Örnek cümle</button><h3 style="margin-top:25px">Ne kadar hatırladın?</h3><div class="row"><button onclick="gradeWord(false)">Tekrar gerekli</button><button class="primary" onclick="gradeWord(true)">Hatırladım ✓</button></div></section><p class="muted">Tekrar gerekli: 10 dakika. Hatırladım: seviyeye göre 1, 3 veya 7 gün. Bu kendini değerlendirme sistemidir.</p>`}
function flipWord(){wordFlipped=true;$('wordAnswer').classList.remove('hidden');$('revealWord').disabled=true}
function gradeWord(ok){if(!wordFlipped)return;wordFlipped=false;let i=wordOrder[wordPos],c=state.cards[i]||{level:0};c.level=ok?Math.min(3,c.level+1):0;c.due=Date.now()+(ok?[1,3,7][c.level-1]*86400000:600000);state.cards[i]=c;save();wordPos++;renderWord()}
function stats(){navigate('learn');let answers=Object.values(state.answers),correct=answers.filter(a=>a.correct).length,percent=answers.length?Math.round(correct/answers.length*100):0,domains=[...new Set(DATA.cases.map(x=>x.domain))];app.innerHTML=`<div class="eyebrow">GELİŞİMİN GÖRÜNÜR OLSUN</div><h2 style="margin-top:13px">Neyi çözdün?<br>Nerede tekrar gerek?</h2><div class="kpis"><div><b>${correct}/40</b><span>Son yanıtı doğru</span></div><div><b>${percent}%</b><span>Denediğin problemlerde</span></div><div><b>${state.visits.length}</b><span>Farklı çalışma günü</span></div></div><section class="card"><h3>Konu bazında durum</h3>${domains.map(d=>{let all=DATA.cases.filter(c=>c.domain===d),ok=all.filter(c=>state.answers[c.id]?.correct).length;return `<div style="margin:18px 0"><div class="row between"><b>${d}</b><small>${ok}/${all.length}</small></div><div class="meter" style="margin-top:8px"><i style="width:${ok/all.length*100}%"></i></div></div>`}).join('')}</section><section class="card"><h3>Kazandığın kilometre taşları</h3>${[['İlk mühendislik kararı',correct>=1],['On problemde doğru sonuç',correct>=10],['TOC okuru',state.read.filter(i=>DATA.lessons[i][0]==='TOC').length>=6],['Fabrika vardiyası tamamlandı',state.campaigns.factory?.finished],['İfade ustası',Object.values(state.cards).filter(x=>x.level>=2).length>=10]].map(([t,ok])=>`<div class="statrow"><span>${t}</span><b class="${ok?'green':'muted'}">${ok?'✓ Kazanıldı':'Henüz değil'}</b></div>`).join('')}</section><button class="primary" onclick="domain='Tümü';level=0;only='wrong';cases()">Yanlışlarımı çalış →</button><p class="muted">Rapor son yanıtı esas alır. XP her doğru problem ve okunan derste bir kez kazanılır; V2’den varsa yalnızca XP ve lojistik mesaj taslakları aktarılır.</p>`}
function settings(){navigate('settings');app.innerHTML=`<div class="eyebrow">SANA GÖRE ÇALIŞMA ALANI</div><h2 style="margin-top:13px">Ayarlar & yedek</h2><section class="card"><div class="row"><button onclick="state.settings.light=!state.settings.light;save();applySettings();settings()">${state.settings.light?'☾ Koyu tema':'☼ Açık tema'}</button><button onclick="state.settings.large=!state.settings.large;save();applySettings();settings()">${state.settings.large?'Standart yazı':'Büyük yazı'}</button></div><p class="muted" style="margin-top:18px">Seslendirme telefonun İngilizce metin okuma motorunu kullanır. İngilizce ses kurulmamışsa telefon ayarlarından yüklemen gerekebilir.</p></section><section class="card"><h3>İlerleme yedeği</h3><p class="muted">Yedeği oluşturup kopyala; kendi güvenilir dosyana kaydet. Geri yükleme mevcut V10 ilerlemesinin yerini alır.</p><div class="row"><button onclick="exportBackup()">Yedeği oluştur</button><button onclick="copyBackup()">Kopyala</button></div><label for="backup">JSON yedek alanı</label><textarea id="backup" placeholder="Yedeği buraya yapıştır"></textarea><button class="small" onclick="previewImport()">Yedeği kontrol et</button><div id="importPreview"></div></section><section class="card"><h3>V10 içeriği</h3><p class="muted">40 problem • 12 ders • 40 ifade • 2 vardiya • 8 hesaplama aracı • günlük problem • tekrarlar • İngilizce yazı desteği • gelişim/notlar • tema/yedek.</p><p class="muted">İçerik cihazda çalışır. Yapay zekâ sohbeti ve kapsamlı gramer denetimi yoktur. Sayısal modeller belirtilen varsayımlarla eğitim amaçlıdır.</p></section>`}
function exportBackup(){$('backup').value=JSON.stringify(state,null,2);toast('Yedek hazır. Kopyalayıp güvenilir bir dosyaya kaydet.')}
function copyBackup(){let t=$('backup').value;if(!t){toast('Önce yedeği oluştur.');return}if(window.NativeSpeech?.copy){window.NativeSpeech.copy(t);toast('Yedek panoya kopyalandı.')}else{let el=$('backup');el.select();if(navigator.clipboard?.writeText)navigator.clipboard.writeText(t).then(()=>toast('Kopyalandı.')).catch(()=>toast('Metni seçip elle kopyalayabilirsin.'));else toast('Metni seçip elle kopyalayabilirsin.')}}
let pendingImport=null;function validBackup(s){if(!s||s.schema!==10||!Number.isFinite(s.xp)||s.xp<0)return false;for(let k of ['answers','drafts','notes','cards','settings','campaigns'])if(!s[k]||typeof s[k]!=='object'||Array.isArray(s[k]))return false;for(let k of ['favorites','read','visits'])if(!Array.isArray(s[k]))return false;if(s.read.some(i=>!Number.isInteger(i)||i<0||i>=12)||s.favorites.some(id=>!DATA.cases.some(c=>c.id===id)))return false;for(let [id,v]of Object.entries(s.answers))if(!DATA.cases.some(c=>c.id===id)||typeof v.correct!=='boolean'||!Number.isFinite(v.attempts))return false;for(let [id,v]of Object.entries(s.cards))if(!/^\d+$/.test(id)||+id>=40||!Number.isInteger(v.level)||v.level<0||v.level>3||!Number.isFinite(v.due))return false;for(let v of Object.values(s.drafts).concat(Object.values(s.notes)))if(typeof v!=='string')return false;for(let [id,c]of Object.entries(s.campaigns)){let cfg=DATA.campaigns.find(x=>x.id===id);if(!cfg||!Number.isInteger(c.index)||c.index<0||c.index>cfg.turns.length||!Array.isArray(c.history)||c.history.length!==c.index+(c.locked?1:0)||!Number.isFinite(c.score)||!Number.isFinite(c.backlog)||c.finished!== (c.index===cfg.turns.length))return false;if(c.history.some(x=>typeof x.ok!=='boolean'||typeof x.title!=='string'||typeof x.explain!=='string'||typeof x.sample!=='string'||typeof x.draft!=='string'))return false}return true}
function previewImport(){pendingImport=null;try{if($('backup').value.length>2000000)throw Error();let s=JSON.parse($('backup').value);if(!validBackup(s))throw Error();pendingImport=s;$('importPreview').innerHTML=`<div class="note">Geçerli V10 yedeği: ${Object.keys(s.answers).length} problem kaydı, ${s.xp} XP. Geri yükleme mevcut V10 kaydının yerini alır.</div><button class="primary" onclick="confirmImport()">Bu yedeği geri yükle</button>`}catch(e){$('importPreview').innerHTML='<div class="note">Geçerli bir V10 yedeği bulunamadı. Mevcut verin değiştirilmedi.</div>'}}
function confirmImport(){if(!pendingImport)return;state=pendingImport;pendingImport=null;save();applySettings();home();toast('Yedek geri yüklendi.')}
applySettings();save();home();
</script></body></html>
