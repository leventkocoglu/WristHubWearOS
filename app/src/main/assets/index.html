function modelNotes20(){return `<details class="card"><summary>Model tam olarak neyi hesaplıyor?</summary><p>Tek ürün, 480 dakika/gün, üç seri istasyon, sınırsız ara tampon, engellenme yok. Ham parçalar gün içine eşit aralıklı salınır. İşlem ilerlemesi günler arasında taşınır. Her dakikada önce aşağı akış işlenir; bir parça aynı anda üç istasyondan geçemez.</p><p>Başlangıç: montaj önünde 12, paketleme önünde 4 iş; nakit 10.000 TL. Bu başlangıç stokunun geçmiş maliyeti başlangıç koşuluna dahildir. Kapasiteler: kesim70, montaj40, paket60 adet/gün. 3. gün bakımsız montaj ×0.75. Kalite %90 veya yatırım sonrası %98; rastgele değil, biriken sağlamlık kredisiyle uygulanır. Kalite artışı mevcut hurdayı geri getirmez.</p><p>Teslimatlar gün sonunda yapılır; önce eski gecikme kapanır. Talep dışında satış yok. Nakit = önceki nakit + teslimat×100 − salım×20 − işletme − yatırım. Satış throughput ölçüsü = teslimat×(100−20); nakit ile aynı değildir. Zamanında teslimat, o günün talebinden eski borç sonrası karşılanan kısımdır.</p><p>Bu deterministik eğitim modeli; gerçek fabrikanın tahmini, M/M/1 veya rastgele olay modeli değildir. İşçi paylaşımı, finansman, stok maliyeti ve stokastik arızalar modellenmez.</p></details>`}

limat ${l.shipped} • WIP ${l.wip}</p></div>`).join('')}</section><div class="row"><button class="primary" onclick="chooseFactory20()">Başka senaryo seç</button><button onclick="undoFactory20()">Son günü yeniden dene</button></div>${modelNotes20()}`}

function plan20(){navigate('learn');let steps=[['TOC temeli','Kısıtı bulma dersini oku, hattın ritmi problemini çöz, “constraint” ile cümle yaz.',0,'ie1'],['Salımı yönet','Drum–Buffer–Rope dersini oku; fabrika modelinde 40 ve 80 salımı önizleyerek WIP farkını gör.',2,'ie2'],['Kazancı ölç','Ürün karması dersini oku, kısıt dakikası problemini çöz ve iki ürün aracını dene.',5,'ie4'],['Kalite ve stok','OEE dersini oku, OEE problemini çöz, kalite yatırımı ile daha fazla salımı karşılaştır.',7,'ie10'],['Sonucu savun','Değişim iletişimi dersini oku; beş günlük fabrika raporunu iki İngilizce cümleyle açıkla.',11,'ie23']];app.innerHTML=`<div class="eyebrow">KISA VE YÖNLENDİRMELİ</div><h2 style="margin-top:14px">5 günlük çalışma rotası</h2><p>Takvim zorunluluğu yok. Bir oturumda bir adım seç.</p>${steps.map(([t,tx,l,id],i)=>`<section class="card"><span class="eyebrow">ADIM ${i+1}</span><h3 style="margin-top:13px">${t}</h3><p>${tx}</p><div class="row"><button class="small" onclick="lesson(${l})">Dersi aç</button><button class="small" onclick="openCase('${id}')">Problemi çöz</button></div></section>`).join('')}`}
const drillKinds20=['takt','oee','eoq','rop','little','queue','kanban','fpy'];
function makeDrill20(kind,seed){let x=seed>>>0;function rnd(a,b){x=(Math.imul(x,1664525)+1013904223)>>>0;return a+x%(b-a+1)}let q={kind,seed,unit:'',phrases:[]};switch(kind){case'takt':{let time=rnd(6,8)*60,demand=rnd(12,24)*10;q={...q,title:'Takt süresi',story:`Net production time is ${time} minutes and daily demand is ${demand} units. What is takt time?`,tr:`Net üretim süresi ${time} dakika, günlük talep ${demand} adet. Takt süresi kaç dakika/adet?`,answer:time/demand,unit:'dk/adet',formula:`${time} / ${demand}`,sample:'Our takt time is based on net available time and customer demand.'};break}case'oee':{let a=rnd(80,95),p=rnd(75,95),quality=rnd(90,99);q={...q,title:'OEE',story:`Availability is ${a}%, performance is ${p}% and quality is ${quality}%. Calculate OEE.`,tr:`Kullanılabilirlik %${a}, performans %${p}, kalite %${quality}. OEE yüzde kaç?`,answer:a*p*quality/10000,unit:'%',formula:`(${a}/100) × (${p}/100) × (${quality}/100) × 100`,sample:'We should investigate which loss most limits overall equipment effectiveness.'};break}case'eoq':{let d=rnd(5,20)*1000,s=rnd(1,5)*100,h=rnd(2,8);q={...q,title:'Ekonomik sipariş',story:`Annual demand is ${d} units, order cost is ${s} TL/order and annual holding cost is ${h} TL/unit. Calculate basic EOQ.`,tr:`Yıllık talep ${d}, sipariş maliyeti ${s} TL/sipariş, yıllık taşıma ${h} TL/adet. Temel EOQ kaç adet? Sabit talep, anlık ikmal, indirim ve stoksuz kalma yok.`,answer:Math.sqrt(2*d*s/h),unit:'adet',formula:`√(2 × ${d} × ${s} / ${h})`,sample:'This quantity balances ordering and holding costs under the EOQ assumptions.'};break}case'rop':{let d=rnd(15,60),l=rnd(2,7),ss=rnd(2,10)*10;q={...q,title:'Sipariş tetikleme',story:`Demand is ${d} units/day, lead time is ${l} days and safety stock is ${ss} units. What is the reorder point?`,tr:`Günlük talep ${d}, teslim süresi ${l} gün, güvenlik stoğu ${ss}. Yeniden sipariş noktası kaç adet?`,answer:d*l+ss,unit:'adet',formula:`${d} × ${l} + ${ss}`,sample:'We should place a replenishment order when inventory position reaches the reorder point.'};break}case'little':{let rate=rnd(15,40),hours=rnd(2,7),wip=rate*hours;q={...q,title:'Süreçte geçen süre',story:`A stable process averages ${wip} jobs in the system and throughput is ${rate} jobs/hour. What is mean system flow time?`,tr:`Kararlı süreçte ortalama ${wip} iş var; çıktı ${rate} iş/saat. Aynı sistem sınırlarında ortalama akış süresi kaç saat?`,answer:hours,unit:'saat',formula:`${wip} / ${rate}`,sample:'Average flow time follows from WIP divided by throughput using consistent boundaries.'};break}case'queue':{let a=rnd(3,10),m=a+rnd(2,6);q={...q,title:'Kuyruk beklemesi',story:`An M/M/1 queue has arrivals ${a}/hour and service rate ${m}/hour. What is expected queue waiting time in minutes?`,tr:`M/M/1: geliş ${a}/saat, hizmet ${m}/saat. Poisson geliş, bağımsız üstel hizmet, tek FCFS sunucu, sınırsız kuyruk ve kararlı durum. Kuyrukta bekleme kaç dakika?`,answer:60*a/(m*(m-a)),unit:'dakika',formula:`60 × ${a} / [${m} × (${m} − ${a})]`,sample:'Expected queue waiting time depends on both utilisation and spare service capacity.'};break}case'kanban':{let d=rnd(10,30),l=rnd(1,4),c=rnd(1,3)*10,s=rnd(1,3)*10;q={...q,title:'Kanban sayısı',story:`Demand ${d}/hour, replenishment ${l} hours, safety factor ${s}% and container size ${c}. How many cards are needed, rounded up?`,tr:`Talep ${d}/saat, ikmal ${l} saat, güvenlik faktörü %${s}, kap ${c} adet. Basit formülle yukarı yuvarlanmış kart sayısı?`,answer:Math.ceil(d*l*(1+s/100)/c),unit:'kart',formula:`ceil[${d} × ${l} × (1+${s}/100) / ${c}]`,sample:'The calculated card count needs validation against actual replenishment performance.'};break}case'fpy':{let total=rnd(2,10)*100,percentage=rnd(80,98),good=total*percentage/100;q={...q,title:'İlk seferde doğru',story:`${good} out of ${total} units pass without rework. What is first-pass yield?`,tr:`${total} üründen ${good} adedi yeniden işlem olmadan geçti. FPY yüzde kaç?`,answer:percentage,unit:'%',formula:`${good} / ${total} × 100`,sample:'First-pass yield excludes products that required rework.'};break}default:return makeDrill20('takt',seed)}return q}
function drill20(newQuestion=false,kind){navigate('cases');let d=state.drill20;if(newQuestion||!d.last){d.seed=(d.seed+1)>>>0;d.last=makeDrill20(kind||drillKinds20[d.seed%8],d.seed);d.answered=false;d.response='';save()}let q=d.last;app.innerHTML=`<div class="eyebrow">DEĞİŞEN SAYILAR • GERÇEK HESAP</div><h2 style="margin-top:14px">Aynı kavramı<br>yeni verilerle çöz.</h2><div class="modelnav">${drillKinds20.map(k=>`<button onclick="drill20(true,'${k}')" class="${k===q.kind?'selected':''}">${({takt:'Takt',oee:'OEE',eoq:'EOQ',rop:'ROP',little:'Little',queue:'M/M/1',kanban:'Kanban',fpy:'FPY'})[k]}</button>`).join('')}</div><section class="card"><h3>${q.title}</h3><p class="message">${q.story}</p><details><summary>Türkçe durumu göster</summary><p>${q.tr}</p></details><label for="drillNumber20">Yanıt • ${q.unit}</label><input id="drillNumber20" inputmode="decimal" value="${esc(d.response||'')}" placeholder="Sayısal değer"><button class="primary" style="margin-top:14px" id="drillSubmit20" onclick="answerDrill20()">Yanıtı kontrol et</button><div id="drillResult20"></div></section><div class="row"><button onclick="drill20(true)">Yeni sayılarla devam →</button><button onclick="cases()">40 temel problem</button></div><p class="muted">Bu antrenman değişen veriler üretir; ayrı bir “yeni konu” sayısı değildir. ${d.asked} denemede ${d.right} doğru. Tekrarlı XP verilmez; sayısal tolerans ±%0.5 veya sıfır için ±0.005.</p>`;if(d.answered)showDrillResult20()}
function answerDrill20(){let d=state.drill20;if(d.answered)return;let n=parseNumber($('drillNumber20').value);if(!Number.isFinite(n)){toast('Önce geçerli bir sayı gir.');return}d.response=$('drillNumber20').value;d.correct=Math.abs(n-d.last.answer)<=Math.max(.005,Math.abs(d.last.answer)*.005);d.answered=true;d.asked++;if(d.correct)d.right++;save();showDrillResult20()}
function showDrillResult20(){let d=state.drill20,q=d.last;$('drillSubmit20').disabled=true;$('drillResult20').innerHTML=`<div class="feedback"><h3>${d.correct?'Doğru ✓':'Çözüm yolunu incele'}</h3><p><b>${Number.isInteger(q.answer)?q.answer:q.answer.toFixed(3)} ${q.unit}</b></p><p>${q.formula}</p><p class="message">${q.sample}</p><button class="small" onclick="speak(state.drill20.last.sample)">▶ İş cümlesini dinle</button></div>`}

function notesStudio40(){return `<details class="card"><summary>Planlama ve belirsizlik varsayımları</summary><p>İki ürün, üç ortak kaynak, bir plan dönemi. Süreler birim başına toplam kaynak dakikalarıdır. Set-up, sıra, öncelik ilişkisi, ara stok ve teslim tarihi çizelgelemesi yok; dönem düzeyinde kapasite dengesi çözülür. Nominal planda bütün üretim nominal talep sınırı içinde satılır.</p><p>Net dönem nakit katkısı = satış − malzeme − dönem sabit gideri − mesai. Bütçe yalnızca malzeme ve mesai için dönem başı sınırıdır; sabit gider bu bütçeye dahil değildir. Her ürünün satış katkısı pozitiftir. Tam sayı A adayları ve her A için en büyük uygulanabilir B değerlendirilir; mesai optimizasyonunda 27 kombinasyon denenir.</p><p>Belirsizlikte nominal plan üst miktardır. Seçilen A/B sırasıyla, gerçekleşen kapasitelerin izin verdiği tam sayılı miktarlar üretilir. Satış gerçekleşen talep ile sınırlıdır; üretilen fakat satılmayan ürünün malzeme nakit çıkışı gerçekleşir, stok değeri bu dönem nakit katkısına eklenmez. Satın alınan mesai her denemede ödenir. Nakit katkısı muhasebe kârı veya şirket değerlemesi değildir.</p></details>`}

function validStudio40(s){if(!s||!studios40[s.scenario]||!validPlan40(s.plan)||typeof s.memo!=='string'||s.memo.length>100000||!Number.isInteger(s.riskSeed)||s.riskSeed<1||s.riskSeed>1000000||!Array.isArray(s.saved)||s.saved.length>12||!s.meetings||typeof s.meetings!=='object')return false;for(let x of s.saved)if(!studios40[x.scenario]||!validPlan40(x.plan)||!evaluatePlan40(studios40[x.scenario],x.plan).feasible||typeof x.date!=='string')return false;for(let [k,v]of Object.entries(s.meetings))if(!meetings40[k]||typeof v!=='boolean')return false;if(s.meetingSession){let m=s.meetingSession;if(!meetings40[m.role]||!Number.isInteger(m.index)||m.index<0||m.index>3||!Array.isArray(m.answers)||m.answers.length<m.index||m.answers.length>Math.min(3,m.index+1)||m.answers.some(n=>!Number.isInteger(n)||n<0||n>2))return false}if(s.lastRisk){let x=s.lastRisk;if(!studios40[x.scenario]||x.scenario!==s.scenario||!validPlan40(x.plan)||JSON.stringify(x.plan)!==JSON.stringify(s.plan)||!evaluatePlan40(studios40[x.scenario],x.plan).feasible||!Number.isInteger(x.seed)||x.seed<1||x.seed>1000000)return false}return true}

const courses41=[
{title:'Takt ve kapasite',why:'Takt müşterinin istediği ritimdir. Çevrim süresi ise istasyonun gerçek çalışma hızıdır; ikisini karşılaştırarak kapasite açığını buluruz.',formula:'Takt = net süre / talep',symbols:'Net süre: dk/vardiya • Talep: adet/vardiya • Takt: dk/adet',steps:['480 dakikalık vardiyadan 60 dakika planlı mola çıkar: 420 dk.','210 adet talep için 420 / 210 = 2 dk/adet.','Çevrim 2,5 dk/adet ise kapasite 420 / 2,5 = 168 adet; açık 42 adettir.'],assume:'Aynı dönem ve aynı ürün birimi kullanılmalı. Net süreden çıkarılan molayı ikinci kez çıkarma.',question:'Net süre 360 dakika, talep 240 adet. Takt kaç dk/adet?',answer:1.5,unit:'dk/adet',wrong:'Talebi süreye bölmek adet/dk verir. Burada istenen dk/adet: 360 ÷ 240.',english:'Our cycle time exceeds takt time, so capacity is below demand.'},
{title:'OEE: kaybı parçala',why:'OEE, planlı üretim süresinin ne kadarının ideal hızda iyi ürün ürettiğini gösterir. Üç yüzde toplanmaz, çarpılır.',formula:'OEE = kullanılabilirlik × performans × kalite',symbols:'A = çalışma / planlı süre • P = ideal çevrim × toplam adet / çalışma • Q = iyi / toplam adet',steps:['Planlı süre 480 dk, çalışma 432 dk: A = 432 / 480 = 0,90.','İdeal çevrim 1 dk, toplam 360 adet: P = 360 / 432 = 0,8333.','342 iyi ürün: Q = 342 / 360 = 0,95. OEE = 0,90 × 0,8333 × 0,95 = %71,25.'],assume:'Planlı üretim süresini tutarlı tanımla. Kalite kaybını performanstan da düşürerek iki kez sayma.',question:'A=%80, P=%90, Q=%95. OEE yüzde kaçtır?',answer:68.4,unit:'%',wrong:'Yüzdeleri ondalığa çevir: 0,80 × 0,90 × 0,95 × 100 = 68,4.',english:'Availability is our largest loss; we should investigate downtime first.'},
{title:'Little yasası',why:'Sistemdeki iş miktarı, çıkış hızı ve ortalama akış süresini birbirine bağlar. Fazla iş salmak tek başına daha fazla teslimat yaratmaz.',formula:'L = λ × W → W = L / λ',symbols:'L: ortalama WIP (adet) • λ: ortalama çıkış (adet/saat) • W: ortalama akış süresi (saat)',steps:['Sistem sınırını girişten sevkiyata kadar belirle.','Ortalama WIP 120 adet, çıkış 30 adet/saat.','W = 120 / 30 = 4 saat. Çıkış sabitken WIP 60 olursa W = 2 saat.'],assume:'Uzun dönem dengeli ortalamaları ve aynı sistem sınırını kullan. Tek anlık stok fotoğrafından kesin teslim süresi çıkarma.',question:'Ortalama WIP 90 adet, çıkış 30 adet/saat. Ortalama süre kaç saat?',answer:3,unit:'saat',wrong:'W = L / λ; 90 adet ÷ 30 adet/saat = 3 saat. Birimler sadeleşir.',english:'Reducing work in progress can shorten flow time at the same throughput.'},
{title:'TOC ve ürün karması',why:'Kısıtlı kaynağın dakikası kıttır. Satış fiyatı yerine kısıt dakikası başına throughput karşılaştırılır; son plan tüm kısıtları da sağlamalıdır.',formula:'T/adet = fiyat − tamamen değişken maliyet; öncelik = T / kısıt dakikası',symbols:'T: ₺/adet • Kaynak tüketimi: dk/adet • Oran: ₺/kısıt dk',steps:['A: 160 − 60 = 100 ₺/adet; 10 kısıt dakikası → 10 ₺/dk.','B: 130 − 50 = 80 ₺/adet; 4 kısıt dakikası → 20 ₺/dk.','Tek aktif kısıt ve yeterli talep örneğinde B önce gelir. Talep, diğer kaynaklar ve tam sayı koşullarıyla planı yeniden doğrula.'],assume:'Tamamen değişken maliyetin ne olduğunu açıkça belirle. Sabit gideri ürün başına dağıtıp bu oranı bozma. Çoklu kısıtta oran sıralaması optimum garantilemez.',question:'T=90 ₺/adet ve kısıt süresi 6 dk/adet. Oran kaç ₺/dk?',answer:15,unit:'₺/dk',wrong:'90 ₺/adet ÷ 6 dk/adet = 15 ₺/dk. En yüksek satış fiyatı her zaman en iyi seçim değildir.',english:'We should prioritize throughput per constraint minute, then verify feasibility.'},
{title:'EOQ ve sipariş noktası',why:'EOQ ne kadar sipariş vereceğini, ROP ne zaman sipariş vereceğini söyler. Bunlar farklı kararlardır.',formula:'Q* = √(2DS/H); ROP = d × L + SS',symbols:'D: adet/yıl • S: ₺/sipariş • H: ₺/(adet·yıl) • d: adet/gün • L: gün • SS: adet',steps:['D=10.000, S=200, H=4 → 2DS/H = 1.000.000 adet².','Karekök al: Q* = 1.000 adet.','d=40 adet/gün, L=5 gün, SS=60 adet → ROP = 40 × 5 + 60 = 260 adet.'],assume:'Klasik EOQ sabit talep, sabit teslim süresi, anlık ikmal ve miktar indirimi olmaması varsayımlarını kullanır. ROP stok pozisyonuyla izlenir: eldeki + yoldaki − karşılanmamış talep.',question:'d=30 adet/gün, L=4 gün, SS=20 adet. ROP kaç adet?',answer:140,unit:'adet',wrong:'Teslim süresindeki talep 30 × 4 = 120; güvenlik stoğu 20 ekle: 140 adet.',english:'We reorder when inventory position reaches 140 units.'},
{title:'M/M/1: doluluk ve bekleme',why:'Ortalama servis kapasitesi talebi aşsa bile değişkenlik kuyruk yaratır. Doluluk bire yaklaştıkça bekleme doğrusal artmaz.',formula:'ρ = λ/μ; W = 1/(μ−λ); Wq = W−1/μ',symbols:'λ: geliş/saat • μ: servis/saat • W: sistemde saat • Wq: kuyrukta saat',steps:['λ=8/saat, μ=10/saat → ρ=0,80.','W=1/(10−8)=0,5 saat = 30 dakika.','Servis süresi 1/10 saat = 6 dk; Wq = 30−6 = 24 dk.'],assume:'Tek sunucu, Poisson geliş, bağımsız üstel servis, sınırsız kuyruk ve kararlı λ<μ gerekir. Bu varsayımlar sağlanmıyorsa sonuç tahmin olarak bile dikkatle değerlendirilmelidir.',question:'λ=6/saat ve μ=10/saat. W kaç dakika?',answer:15,unit:'dk',wrong:'Önce 1/(10−6)=0,25 saat. Dakikaya çevirmek için 60 ile çarp: 15 dk.',english:'High utilization increases waiting time even when average capacity is sufficient.'}
];
let courseIndex41=0,courseStage41=0;
function academy41(i=0,stage=0){courseIndex41=i;courseStage41=stage;navigate('learn');let c=courses41[i];app.innerHTML=`<button class="quiet small" onclick="learn()">← Akademi</button><div class="eyebrow">REHBERLİ ÖĞRENME • ${i+1}/6</div><h2>${c.title}</h2><div class="row guideTabs41">${['Anla','Çöz','Dene'].map((s,j)=>`<button class="${stage===j?'primary':''} small" onclick="academy41(${i},${j})">${j+1}. ${s}</button>`).join('')}</div><section class="card guide41">${stage===0?`<h3>Bu formül neden var?</h3><p>${c.why}</p><div class="formula41">${c.formula}</div><p>${c.symbols}</p><details><summary>Hangi koşullarda geçerli?</summary><p>${c.assume}</p></details>`:stage===1?`<h3>Birlikte çözelim</h3>${c.steps.map((s,j)=>`<div class="step41"><b>${j+1}</b><p>${s}</p></div>`).join('')}<div class="note">Yaygın hata / sınır: ${c.assume}</div>`:`<h3>Şimdi sıra sende</h3><p>${c.question}</p><label>Yanıt (${c.unit})<input id="practice41" inputmode="decimal" placeholder="Örn. 1,5"></label><button class="primary" onclick="checkPractice41()">Çözümümü kontrol et</button><div id="feedback41" role="status" aria-live="polite"></div>`}</section><p class="message">${c.english}</p><button class="small" onclick="speak(courses41[${i}].english)">▶ İngilizceyi dinle</button><div class="row" style="margin-top:18px">${stage<2?`<button class="primary" onclick="academy41(${i},${stage+1})">${stage===0?'Örneği adım adım çöz →':'Kendini dene →'}</button>`:`<button onclick="academy41(${(i+1)%6})">Sonraki konu →</button>`}<button onclick="flowLab41()">Akışı gör →</button></div>`}
function checkPractice41(){let c=courses41[courseIndex41],v=parseNumber($('practice41').value);$('feedback41').innerHTML=`<div class="note">${Number.isFinite(v)&&Math.abs(v-c.answer)<0.005?'✓ Doğru. '+c.answer+' '+c.unit+'. Birimleri de kontrol ettin.':'Tekrar düşün: '+c.wrong}</div>`}
function newFlow41(){return {tick:0,released:0,q1:0,q2:0,done:0,history:[]}}
function flowStep41(prev,release,capacity){if(![release,capacity].every(Number.isInteger)||release<0||release>10||capacity<1||capacity>10)throw Error('Invalid flow input');let s={...prev,history:prev.history.slice()},out=Math.min(s.q2,6),middle=Math.min(s.q1,capacity);s.q2+=middle-out;s.q1+=release-middle;s.done+=out;s.released+=release;s.tick++;s.history.push({tick:s.tick,wip:s.q1+s.q2,done:s.done});return s}
let flowState41=newFlow41(),flowPlaying41=false,flowToken41=0;
function flowLab41(){flowPlaying41=false;flowToken41++;navigate('learn');app.innerHTML=`<button class="quiet small" onclick="learn()">← Akademi</button><div class="eyebrow">GÖRSEL TOC LABORATUVARI</div><h2>Darboğazı gör.<br>Kararını değiştir.</h2><p>Her adım bir dakikadır. Önce mevcut işler ilerler; yeni salım ilk kuyruğa girer. Kuyruklar sınırsız, ürünler özdeş, fire ve arıza yoktur.</p><section class="card"><label>Salım: <output id="releaseLabel41">8</output> adet/dk<input id="release41" type="range" min="0" max="10" value="8" oninput="$('releaseLabel41').textContent=this.value"></label><label>Montaj kapasitesi: <output id="capacityLabel41">4</output> adet/dk<input id="capacity41" type="range" min="1" max="10" value="4" oninput="$('capacityLabel41').textContent=this.value"></label><div class="row"><button class="primary" id="play41" onclick="toggleFlow41()">▶ Oynat</button><button onclick="advanceFlow41()">1 dk ilerlet</button><button onclick="resetFlow41()">Sıfırla</button></div></section><section class="flowScene41" aria-label="Üretim akış modeli"><div class="flowStation41">Giriş<span>Salım</span></div><div class="flowQueue41"><b id="q141">0</b><span>Montaj öncesi</span><div id="dots141" class="dots41"></div></div><div class="flowStation41 assembly41">Montaj<span id="capText41">4/dk</span></div><div class="flowQueue41"><b id="q241">0</b><span>Paket öncesi</span><div id="dots241" class="dots41"></div></div><div class="flowStation41">Paket<span>6/dk</span></div></section><section class="card"><div id="flowNumbers41" role="status" aria-live="polite"></div><svg id="flowChart41" viewBox="0 0 320 120" role="img" aria-label="Zamana göre sistemdeki iş grafiği"></svg><p id="flowInsight41"></p><p class="muted">Grafik: yatay eksen dakika, dikey eksen WIP (adet); son 30 adım. Noktalar en fazla 24 işi temsil eder; gerçek adet yukarıda yazılıdır.</p></section><details><summary>TOC’nin beş adımını bu modelde uygula</summary><ol><li>Belirle: Salım, montaj ve paket kapasitesini karşılaştır.</li><li>İşlet: Darboğazı besle; modelde duruş olmadığı için boş kalmasını gözle.</li><li>Tabi kıl: Salımı sistem ritmine indir; WIP değişimini izle.</li><li>Yükselt: Montaj kapasitesini artır; yeni kısıt paketlemeye geçebilir.</li><li>Tekrarla: Kısıt değiştiğinde önceki politikayı sorgula.</li></ol><p>Bu sade modelde WIP anlık stoktur; Little yasasındaki uzun dönem ortalamasıyla karıştırma.</p></details>`;renderFlow41()}
function renderFlow41(){if(!$('flowNumbers41'))return;let s=flowState41,cap=Number($('capacity41').value),release=Number($('release41').value);$('q141').textContent=s.q1;$('q241').textContent=s.q2;$('capText41').textContent=cap+'/dk';for(let [id,n]of [['dots141',s.q1],['dots241',s.q2]])$(id).innerHTML=Array.from({length:Math.min(24,n)},()=>'<i></i>').join('');$('flowNumbers41').innerHTML=`<div class="statrow"><span>Süre</span><b>${s.tick} dk</b></div><div class="statrow"><span>Salınan / teslim</span><b>${s.released} / ${s.done} adet</b></div><div class="statrow"><span>WIP = salınan − teslim</span><b>${s.q1+s.q2} = ${s.released} − ${s.done}</b></div>`;let h=s.history.slice(-30),max=Math.max(1,...h.map(x=>x.wip));$('flowChart41').innerHTML=`<text x="2" y="12" fill="currentColor" font-size="10">WIP • üst sınır ${max} adet</text><path d="M20 20 V100 H310" fill="none" stroke="currentColor" opacity=".3"/><polyline points="${h.map((x,i)=>(20+i*290/Math.max(1,h.length-1))+','+(100-x.wip/max*75)).join(' ')}" fill="none" stroke="#20bf9c" stroke-width="3"/><text x="20" y="116" fill="currentColor" font-size="10">${h[0]?.tick||0} dk</text><text x="270" y="116" fill="currentColor" font-size="10">${s.tick} dk</text>`;$('flowInsight41').textContent=release>Math.min(cap,6)?'Salım sistem kapasitesini aşıyor. Daha fazla iş salmak kuyruğu büyütür; teslim ritmini en yavaş istasyon sınırlar.':cap>6?'Montaj artık paketlemeden hızlı. Yeni kapasite kısıtı paketleme: 6 adet/dk.':'Salım kapasiteyi aşmıyor. Başlangıç geçişlerinden sonra kuyrukların eğilimini gözle.'}
function advanceFlow41(){if(!$('release41'))return;flowState41=flowStep41(flowState41,Number($('release41').value),Number($('capacity41').value));renderFlow41();if(!window.matchMedia||!window.matchMedia('(prefers-reduced-motion: reduce)').matches)document.querySelectorAll('.dots41 i').forEach((el,i)=>{if(el.animate)el.animate([{opacity:.2,transform:'translateY(-8px)'},{opacity:1,transform:'translateY(0)'}],{duration:350,delay:i*8})})}
function toggleFlow41(){flowPlaying41=!flowPlaying41;$('play41').textContent=flowPlaying41?'Ⅱ Duraklat':'▶ Oynat';let token=++flowToken41;function loop(){if(!flowPlaying41||token!==flowToken41||!$('release41')||route!=='learn')return;advanceFlow41();setTimeout(loop,900)}if(flowPlaying41)loop()}
function resetFlow41(){flowPlaying41=false;flowToken41++;flowState41=newFlow41();$('play41').textContent='▶ Oynat';renderFlow41()}
const learnBefore41=learn;learn=function(){learnBefore41();app.insertAdjacentHTML('afterbegin',`<section class="hero"><div class="eyebrow">V41 • ANLA → ÇÖZ → DENE</div><h2>Formül ezberleme.<br>Nasıl işlediğini gör.</h2><button class="primary" onclick="flowLab41()">Canlı darboğaz laboratuvarı →</button></section><div class="section"><h3>6 rehberli konu</h3></div>${courses41.map((c,i)=>`<button class="listbutton" onclick="academy41(${i})"><b>${c.title}</b><span>→</span></button>`).join('')}`)};
const homeBefore41=home;home=function(){homeBefore41();app.insertAdjacentHTML('afterbegin','<section class="card guideBanner41"><div class="eyebrow">YENİ • GÖREREK ÖĞREN</div><h3>Bir formül. Bir deney. Bir karar.</h3><p>Birimleri anla, çözümü izle, darboğazı hareket halinde gör.</p><div class="row"><button class="primary" onclick="academy41()">Rehberli derse başla →</button><button onclick="flowLab41()">Akış laboratuvarı</button></div></section>')};

applySettings();save();home();
</script></body></html>
