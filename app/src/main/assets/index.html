<!DOCTYPE html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WorkFlow English</title><style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#0b1220;color:#edf2fb}*{box-sizing:border-box}body{margin:0}main{max-width:760px;margin:auto;padding:22px 18px 100px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:27px;margin:6px 0}h2{font-size:23px}p{line-height:1.65;color:#bdc9dc}.tag{color:#70e5c2;font-size:12px;letter-spacing:2px}.card{background:#152137;border:1px solid #293953;border-radius:20px;padding:20px;margin:16px 0}.hero{background:linear-gradient(130deg,#183951,#18352f)}.stats{display:flex;gap:10px}.stats>div{flex:1;background:#101c30;padding:14px;border-radius:14px;font-size:13px}.stats b{display:block;font-size:25px;margin-bottom:4px}button,select{font:inherit;color:inherit;border:1px solid #385071;border-radius:12px;padding:13px;background:#1c2c46;cursor:pointer}button:disabled{opacity:.65;cursor:default}.primary{background:#72e5c1;color:#092b24;border:0;font-weight:700}button:hover{filter:brightness(1.1)}.options{display:grid;gap:10px}.options button{text-align:left}.good{border-color:#75efb6!important;background:#173b32!important}.bad{border-color:#f29a98!important;background:#452a35!important}.pill{display:inline-block;background:#273c58;padding:7px 10px;border-radius:20px;margin:4px;font-size:13px}textarea{display:block;width:100%;height:150px;background:#0e192a;color:#f0f5ff;border:1px solid #47627f;border-radius:12px;padding:14px;font:inherit;line-height:1.5;margin:12px 0}nav{position:fixed;bottom:0;left:0;right:0;background:#0e192aef;border-top:1px solid #293953;display:flex;justify-content:center;gap:6px;padding:12px}nav button{font-size:13px;padding:10px}.hidden{display:none}small{color:#a9b8cf;line-height:1.6}progress{width:100%;accent-color:#70e5c2}a{color:#75dfd4}.row{display:flex;gap:8px;flex-wrap:wrap}.message{font-size:18px;color:#eff4fb}.feedback{border-left:3px solid #70e5c2;padding-left:14px;margin-top:15px}details{margin-top:16px}summary{cursor:pointer;color:#72e5c1}.toast{color:#72e5c1}label{display:block;margin-top:12px}select{width:100%;margin-top:8px} @media(max-width:380px){nav button{font-size:11px;padding:9px 6px}}

body{background:radial-gradient(ellipse at 80% 0%,#17323b 0,transparent 45%),#080f1c}main{padding-top:30px}.hero{background:linear-gradient(135deg,#133a42,#182845 65%);position:relative;overflow:hidden}.hero:after{content:'◈';position:absolute;right:12px;top:20px;font-size:130px;opacity:.07;pointer-events:none}.card{box-shadow:0 12px 30px #0002;border-color:#263a50}.tag{letter-spacing:1.5px}button{min-height:45px}button:focus-visible,textarea:focus-visible{outline:2px solid #7be6c1;outline-offset:3px}h2{letter-spacing:-.5px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tile{padding:18px;border-radius:16px;text-align:left;background:linear-gradient(150deg,#1b3044,#162136)}.tile b{display:block;margin:10px 0;font-size:17px}.tile small{font-size:12px}.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kpi div{background:#101c2d;border-radius:12px;padding:12px;font-size:12px}.kpi strong{display:block;font-size:22px;color:#7ce2c8}input[type=range]{width:100%;accent-color:#79e2c3}input[type=number]{width:100%;padding:12px;background:#101c2d;border:1px solid #39516c;border-radius:10px;color:white;font:inherit}.meter{height:9px;background:#26354a;border-radius:8px;overflow:hidden;margin:6px 0}.meter i{display:block;height:100%;background:linear-gradient(90deg,#75e6bf,#6ea6ff)}.note{font-size:13px;border-left:3px solid #f5cb7e;padding:10px 14px;background:#2b2933;border-radius:7px}.options button{line-height:1.5}.muted{font-size:13px;color:#98abc4}.badge{color:#f0cd91}nav{padding-bottom:max(12px,env(safe-area-inset-bottom));z-index:10}nav button.active{background:#294952;border-color:#71d8c1}.log{border-bottom:1px solid #304054;padding:12px 0}details p{font-size:15px}.stepnum{font-size:36px;color:#65d4b9}.scene{display:flex;justify-content:space-between;padding:15px 0;gap:10px}.scene>span{padding:12px;background:#0d1b2c;border-radius:12px;flex:1;text-align:center;font-size:12px}.scene b{display:block;font-size:24px;margin-bottom:5px}@media(max-width:360px){main{padding-left:12px;padding-right:12px}.grid{gap:8px}.tile{padding:13px}.kpi strong{font-size:19px}}
</style><main><header><div><div class="tag">CONTROL TOWER • LEARN BY DOING</div><h1>WorkFlow English</h1></div><span>◉</span></header><div id="app"></div></main><nav><button onclick="home()">Merkez</button><button onclick="start()">Simülasyon</button><button onclick="review()">Tekrar</button><button onclick="theory()">TOC</button></nav><script>
const scenarios=[{"id": 0, "title": "Geciken gemi", "step": "Identify", "message": "The vessel departure has been delayed by 24 hours. The customer asks whether the original delivery date is still achievable. Customs clearance takes two days and has no spare capacity.", "options": ["Promise the original delivery date.", "Check customs capacity and revise the delivery estimate.", "Send more containers to the port."], "correct": 1, "why": "Darboğaz gümrük kapasitesi. Geminin gecikmesini tüm teslim zinciriyle değerlendir; doğrulanmamış tarih vaat etme.", "phrases": ["departure", "delivery estimate", "confirm"], "sample": "The vessel departure has been delayed by 24 hours. We are checking customs capacity and will confirm a revised delivery estimate by 15:00."}, {"id": 1, "title": "Eksik SI bilgisi", "step": "Exploit", "message": "The documentation team can process 12 shipments per day. Three submissions have missing consignee details. The shipping instruction deadline is 16:00.", "options": ["Submit all files even if incomplete.", "Wait until every shipment is ready.", "Validate complete files and request missing details immediately."], "correct": 2, "why": "Sınırlı dokümantasyon kapasitesini yeniden işleme harcatma. Hazır dosyaları işle, eksikleri ayrı takip et.", "phrases": ["missing details", "deadline", "complete"], "sample": "Three files have missing consignee details. Please provide the missing details by 14:00 so we can submit complete shipping instructions before the deadline."}, {"id": 2, "title": "Depo kuyruğu", "step": "Subordinate", "message": "Picking capacity is 80 pallets per day, but dispatch can load only 50. There are already 100 pallets waiting for dispatch.", "options": ["Align picking release with dispatch capacity.", "Increase picking to 100 pallets.", "Measure success only by picking output."], "correct": 0, "why": "Depo çıkışı 50 paletle sınırlıysa daha fazla toplama kuyruk oluşturur. İş salımını çıkış kapasitesine göre düzenle.", "phrases": ["capacity", "release", "backlog"], "sample": "Dispatch capacity is 50 pallets per day. We will align picking release with this limit to reduce the backlog and protect urgent orders."}, {"id": 3, "title": "Kapasite artırma", "step": "Elevate", "message": "Loading remains the constraint after appointment scheduling and paperwork preparation have been improved. Demand is consistently above the current capacity.", "options": ["Improve an unrelated reporting dashboard.", "Evaluate an additional loading shift.", "Keep releasing unlimited orders."], "correct": 1, "why": "Mevcut kapasiteyi iyi kullandıktan sonra ek vardiya gibi darboğaz kapasitesini artıran seçenekleri değerlendir.", "phrases": ["additional shift", "constraint", "evaluate"], "sample": "Loading remains our constraint. We propose an additional shift and will evaluate its cost and expected impact on daily dispatch capacity."}, {"id": 4, "title": "Yeni darboğaz", "step": "Repeat", "message": "An additional loading shift has removed the dispatch queue. Shipments now wait for a single customs reviewer.", "options": ["Continue investing only in loading.", "Ignore customs because dispatch improved.", "Reassess the constraint and focus on customs review."], "correct": 2, "why": "Darboğaz taşınabilir. Önceki iyileştirmeyi otomatik sürdürmek yerine yeni sınırı belirle.", "phrases": ["reassess", "customs review", "priority"], "sample": "The dispatch queue has been cleared. We will reassess the constraint and prioritise customs review to improve end-to-end delivery performance."}, {"id": 5, "title": "Müşteriye gecikme bildirimi", "step": "Identify", "message": "Two orders are delayed because export documents have not been approved. The customer requests a status update and a recovery plan.", "options": ["Explain the cause, next action and update time.", "Say everything is on track.", "Blame the document team without a plan."], "correct": 0, "why": "Önce sevkiyatı tutan engeli tanımla. İyi durum mesajı neden, aksiyon ve sonraki güncelleme zamanını içerir.", "phrases": ["approval", "recovery plan", "update"], "sample": "The orders are awaiting export document approval. Our recovery plan is to prioritise the review today. We will send the next update by 16:00."}, {"id": 6, "title": "Cut-off riski", "step": "Exploit", "message": "The terminal cut-off is 18:00. One truck slot remains. Order A has complete documents and is due today; order B has missing documents and is due next week.", "options": ["Send order B because it is larger.", "Assign the slot to order A.", "Leave the slot unused."], "correct": 1, "why": "Kıt slotu evrakı hazır ve acil siparişe ayır. Bu senaryoda büyüklük, teslim önceliğinden daha önemli değil.", "phrases": ["cut-off", "slot", "ready"], "sample": "We have assigned the remaining truck slot to order A, as its documents are ready and its delivery is due today. This protects the terminal cut-off."}, {"id": 7, "title": "Günlük toplantı", "step": "Subordinate", "message": "A manager wants every department to maximise its own output. Packing can handle 60 units per hour, while upstream teams can produce 100.", "options": ["Run all departments at full speed.", "Buy faster upstream equipment.", "Align upstream output with packing capacity."], "correct": 2, "why": "Yerel verimlilik artışı sistem çıktısını her zaman artırmaz. Bu akışta paketleme temposu diğer ekipleri yönlendirir.", "phrases": ["packing", "throughput", "align"], "sample": "Packing is limiting throughput to 60 units per hour. We should align upstream output with packing capacity rather than build excess inventory."}, {"id": 8, "title": "Taşıyıcı eskalasyonu", "step": "Exploit", "message": "Only one carrier confirmation is needed to release a priority shipment. The carrier has not replied, and the booking deadline is approaching.", "options": ["Escalate the pending confirmation with a clear deadline.", "Send vague reminders to everyone.", "Create duplicate bookings immediately."], "correct": 0, "why": "Engeli kaldırabilecek kişiye net talep, referans ve süre ilet. Tekrar işlem yaratmadan öncelikli akışı koru.", "phrases": ["pending", "confirmation", "booking"], "sample": "The carrier confirmation is still pending for our priority booking. Please confirm space availability by 13:00 so we can release the shipment before the deadline."}, {"id": 9, "title": "Gümrük incelemesi", "step": "Exploit", "message": "One customs reviewer handles all declarations. Incomplete files consume half of the reviewer’s day through repeated corrections.", "options": ["Send more incomplete files.", "Introduce a completeness check before review.", "Hire more warehouse pickers."], "correct": 1, "why": "Darboğazın zamanını korumak için ön kontrol uygula. Burada ön kontrol, inceleyicinin tekrar işini azaltır.", "phrases": ["declaration", "review", "corrections"], "sample": "We will check each declaration for completeness before customs review. This should reduce repeated corrections and protect the reviewer’s available time."}, {"id": 10, "title": "Gerçek ATD", "step": "Identify", "message": "The customer asks for actual departure time. Your system shows a planned departure only; there is no confirmed departure event.", "options": ["Report the planned time as actual.", "Invent an estimated actual departure.", "State that ATD is unconfirmed and request verification."], "correct": 2, "why": "Planlanan tarih ile gerçekleşen olay farklıdır. Veri doğruluğu engelini açıkça belirt; ATD uydurma.", "phrases": ["actual departure", "planned", "verified"], "sample": "Actual departure has not yet been verified. The system currently shows the planned departure only. We have requested carrier confirmation and will update you once confirmed."}, {"id": 11, "title": "Teslim önceliği", "step": "Subordinate", "message": "There are ten ready loads but only four dispatch slots. Two loads are due today, two tomorrow, and six next week. All loads require one slot.", "options": ["Assign slots by delivery urgency.", "Choose whichever customer emails most.", "Release all ten loads to the queue."], "correct": 0, "why": "Verilen eşit yük koşullarında teslim aciliyetiyle slotları planla. Gerçek işte sözleşme ve operasyon kısıtlarını da kontrol et.", "phrases": ["urgent", "allocate", "due"], "sample": "We will allocate today’s four dispatch slots to the loads due today and tomorrow. The remaining loads will be scheduled according to delivery urgency."}, {"id": 12, "title": "İyileştirme önerisi", "step": "Elevate", "message": "The documentation queue persists after templates and pre-checks have been introduced. A trained backup reviewer is available for a two-week pilot.", "options": ["Start a measured backup-reviewer pilot.", "Remove quality checks.", "Increase incoming files without a plan."], "correct": 0, "why": "İlk düzenlemeler yetersizse ek kapasiteyi kontrollü pilotla dene. Sonucu sistem akışında ölç.", "phrases": ["pilot", "backup reviewer", "measure"], "sample": "We propose a two-week pilot with a trained backup reviewer. We will measure completed files, turnaround time and error rates before deciding on a permanent change."}, {"id": 13, "title": "Yönetim özeti", "step": "Repeat", "message": "A process change reduced loading time, but total delivery lead time did not improve. The team needs to explain the result to management.", "options": ["Claim the whole system improved.", "Check where shipments now wait.", "Repeat the same loading change indefinitely."], "correct": 1, "why": "Tek aşamadaki hız artışı uçtan uca iyileşme olmayabilir. Bekleme noktalarını yeniden incele.", "phrases": ["lead time", "improvement", "waiting"], "sample": "Loading time has improved, but total delivery lead time remains unchanged. We will analyse where shipments are waiting and target the current constraint."}, {"id": 14, "title": "Zaman tamponu", "step": "Subordinate", "message": "The critical loading station often waits for documents. Documents should be ready two hours before loading, but are usually delivered at the last minute.", "options": ["Prepare documents earlier to protect loading.", "Keep documents until the truck arrives.", "Increase picking speed only."], "correct": 0, "why": "Zaman tamponu kritik istasyonun aç kalmasını önlemeye yardımcı olur. Tampon süresi bu örnekte varsayımdır.", "phrases": ["buffer", "in advance", "loading"], "sample": "We will prepare documents two hours in advance to provide a time buffer for loading. This should reduce idle time at the critical station."}];
let state;try{state=JSON.parse(localStorage.getItem('workflow-v1'))}catch(e){} state=state||{};state.done=state.done||{};state.drafts=state.drafts||{};state.errors=state.errors||[];state.xp=state.xp||0;
let current=null,choice=null,queue=[],filter='All';const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem('workflow-v1',JSON.stringify(state))}catch(e){document.getElementById('storageWarning')?.remove();app.insertAdjacentHTML('beforeend','<p id="storageWarning">Bu ortamda ilerleme kaydedilemiyor. Açık oturumda çalışmaya devam edebilirsin.</p>')}}
function shuffle(a){return a.map(v=>({v,k:Math.random()})).sort((a,b)=>a.k-b.k).map(x=>x.v)}
function home(){current=null;let n=Object.keys(state.done).length;app.innerHTML=`<section class="card hero"><div class="tag">SENİN İŞ GÜNÜN, İNGİLİZCE</div><h2>Bir sevkiyatı kurtar.<br>Bir cümleyi öğren.</h2><p>Müşteriye cevap ver, darboğazı bul ve akışı iyileştir. 15 özgün lojistik senaryosu; internet ve ücretli yapay zekâ gerektirmez.</p><button class="primary" onclick="start()">Vardiyayı başlat →</button></section><div class="stats"><div><b>${state.xp}</b>Deneyim</div><div><b>${n}/15</b>Tamamlanan</div><div><b>${state.errors.length}</b>Tekrar bekleyen</div></div><section class="card"><h3>Bugün ne çalışalım?</h3><label>TOC odağı<select id="filter" onchange="filter=this.value"><option value="All">Tüm senaryolar</option>Identify</option>Exploit</option>Subordinate</option>Elevate</option>Repeat</option></select></label><p>Kararın ardından İngilizce bir durum mesajı yaz. Anahtar ifadeleri, net aksiyonu ve güncelleme zamanını çalış.</p><small>Yazı değerlendirmesi yerel kontrol listesidir; kapsamlı gramer analizi veya yapay zekâ sohbeti değildir. İlerleme bu cihazda saklanır.</small></section>`;document.getElementById('filter').value=filter}
function start(errors=false){queue=shuffle(scenarios.filter(s=>(filter==='All'||s.step===filter)&&(!errors||state.errors.includes(s.id))).map(s=>s.id));if(!errors){queue.sort((a,b)=>Number(!!state.done[a])-Number(!!state.done[b]))}next()}
function next(){if(!queue.length){app.innerHTML='<section class="card hero"><h2>Vardiya tamamlandı ✓</h2><p>Yeni tur açabilir veya yanlış kararlarını tekrar çalışabilirsin.</p><button class="primary" onclick="home()">Merkeze dön</button></section>';return}current=scenarios[queue.shift()];choice=null;render()}
function render(){const s=current;let opts=shuffle(s.options.map((text,index)=>({text,index})));app.innerHTML=`<section class="card"><div class="tag">${esc(s.step)} • ${queue.length+1} SENARYO KALDI</div><h2>${esc(s.title)}</h2><div class="row"><button onclick="speak(current.message)">▶ Dinle</button><button onclick="hint()">İfade ipucu</button></div><p class="message">${esc(s.message)}</p><div id="hint" class="hidden">${s.phrases.map(p=>`<span class="pill">${esc(p)}</span>`).join('')}</div><h3>What would you do next?</h3><div class="options">${opts.map(o=>`<button data-index="${o.index}" onclick="decide(${o.index})">${esc(o.text)}</button>`).join('')}</div><div id="decision"></div></section><section class="card"><h3>Müşteriye yanıtını yaz</h3><small>İngilizce 2–3 cümle: durum + aksiyon + sonraki güncelleme veya beklenen sonuç.</small><textarea id="reply" placeholder="The shipment is currently…" oninput="draft(this.value)">${esc(state.drafts[s.id]||'')}</textarea><div class="row"><button class="primary" onclick="check()">Yanıtı kontrol et</button><button onclick="speak(document.getElementById('reply').value)">Yanıtımı dinle</button></div><div id="writing"></div><details><summary>Örnek yanıtı göster</summary><p>${esc(s.sample)}</p><button onclick="speak(current.sample)">▶ Örneği dinle</button></details></section><button id="next" disabled class="primary" onclick="next()">Sonraki senaryo →</button>`}
function hint(){document.getElementById('hint').classList.toggle('hidden')}
function draft(t){state.drafts[current.id]=t;save()}
function decide(i){if(choice!==null)return;choice=i;let ok=i===current.correct;document.querySelectorAll('[data-index]').forEach(b=>{b.disabled=true;if(+b.dataset.index===current.correct)b.classList.add('good');else if(+b.dataset.index===i)b.classList.add('bad')});if(!state.done[current.id]){state.xp+=ok?20:5;state.done[current.id]=true}if(ok)state.errors=state.errors.filter(id=>id!==current.id);else if(!state.errors.includes(current.id))state.errors.push(current.id);save();document.getElementById('decision').innerHTML=`<div class="feedback"><b>${ok?'Doğru karar ✓':'Bu kararı yeniden düşün'}</b><p>${esc(current.why)}</p></div>`;document.getElementById('next').disabled=false}
function check(){let t=document.getElementById('reply').value.trim();if(!t){document.getElementById('writing').innerHTML='<p>Önce kısa bir İngilizce yanıt yaz.</p>';return}let lower=t.toLowerCase();let found=current.phrases.filter(p=>lower.includes(p));let action=/\b(will|please|propose|request|should|plan|checking|assigned)\b/i.test(t),time=/\b(by|today|tomorrow|hour|week|once|before|after)\b|\d{1,2}:\d{2}/i.test(t);document.getElementById('writing').innerHTML=`<div class="feedback"><b>İletişim kontrol listesi</b><p>${found.length?'✓':'○'} Hedef ifadeler: ${found.length}/${current.phrases.length}<br>${action?'✓':'○'} Aksiyon ifadesi ${action?'bulundu':'eklemeyi dene'}<br>${time?'✓':'○'} Zaman veya koşul ${time?'bulundu':'belirtmeyi dene'}</p><small>Bu kontrol anahtar sözcüklere bakar; anlamın veya gramerin doğru olduğunu garanti etmez. Örnek yanıtla karşılaştır.</small></div>`;draft(t)}
function speak(t){if(!t.trim())return;if(!('speechSynthesis' in window)){alert('Bu ortam seslendirmeyi desteklemiyor. Telefon tarayıcısında deneyebilirsin.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.86;speechSynthesis.speak(u)}
function review(){app.innerHTML=`<section class="card"><h2>Karar tekrarları</h2><p>${state.errors.length?state.errors.length+' senaryoyu tekrar çözerek operasyon kararlarını pekiştir.':'Şu an tekrar bekleyen yanlış karar yok.'}</p>${state.errors.length?'<button class="primary" onclick="filter=&quot;All&quot;;start(true)">Yanlışları çalış →</button>':''}</section><section class="card"><h3>İş İngilizcesi ifade bankası</h3>${[...new Set(scenarios.flatMap(s=>s.phrases))].map(p=>`<button class="pill" onclick="speak(this.textContent)">${esc(p)}</button>`).join('')}<p>Bir ifadeye dokunarak telaffuzunu dinle. İfadeleri senaryolarda cümle içinde kullan.</p></section>`}
function theory(){const steps=[['Identify','Darboğazı belirle','Sistemin hedefini sınırlayan mevcut engeli bul. En uzun kuyruk bir ipucudur; tek başına kesin kanıt değildir.'],['Exploit','Mevcut kapasiteyi iyi kullan','Darboğazın zamanını eksik evrak, gereksiz bekleme ve tekrar işten koru.'],['Subordinate','Diğer işleri uyumla','İş salımını ve öncelikleri darboğazın temposuna göre düzenle; yerel çıktı yerine sistem akışını izle.'],['Elevate','Kapasiteyi artır','Önceki adımlar yetmiyorsa hedefli ek kapasite veya politika değişikliği değerlendir.'],['Repeat','Yeniden belirle','Engel kalktığında yeni darboğazı bul; eski çalışma alışkanlıklarının yeni engel oluşturmasına izin verme.']];app.innerHTML='<section class="card hero"><div class="tag">THEORY OF CONSTRAINTS</div><h2>Akışı sınırlayan yere odaklan.</h2><p>Goldratt’ın TOC yaklaşımından esinlenen özgün eğitim örnekleri. Belirli bir kitabın özeti veya alıntısı değildir.</p></section>'+steps.map((s,i)=>`<section class="card"><div class="tag">0${i+1} • ${s[0]}</div><h3>${s[1]}</h3><p>${s[2]}</p><button onclick="filter='${s[0]}';start()">Bu adımı çalış →</button></section>`).join('')+'<section class="card"><h3>Drum • Buffer • Rope</h3><p><b>Drum:</b> Darboğazın temposu.<br><b>Buffer:</b> Akışı aksamalardan koruyan tampon.<br><b>Rope:</b> Yeni işin sisteme girişini bu tempoya bağlayan mekanizma.</p><p>Bu uygulama temel karar pratiği sunar; gerçek operasyon ölçümleri veya kurumsal sistem bağlantısı içermez.</p><a href="https://www.tocinstitute.org/five-focusing-steps.html" target="_blank" rel="noopener">Kaynak: TOC Institute — Five Focusing Steps</a></section>'}

const oldHome=home,oldRender=render,oldTheory=theory,oldSpeak=speak,oldCheck=check;
state.cards=state.cards||{};state.campaign=state.campaign||null;
const lexicon=[['constraint','kısıt / darboğaz','The current constraint is customs review.'],['throughput','sistemin çıktı hızı; TOC finansında satışla yaratılan kazanç hızı','We need to improve end-to-end throughput.'],['backlog','birikmiş işler','The backlog is increasing.'],['lead time','başlangıçtan tamamlanmaya kadar geçen süre','We need to reduce delivery lead time.'],['pending','bekleyen / sonuçlanmamış','Carrier confirmation is pending.'],['allocate','tahsis etmek','Please allocate a loading slot.'],['stagger','zamana yaymak','We should stagger truck arrivals.'],['escalate','üst sorumluya taşımak','We need to escalate this issue.'],['revise','gözden geçirip değiştirmek','We will revise the delivery estimate.'],['capacity','kapasite','Demand exceeds our daily capacity.'],['assumption','varsayım','Let us challenge that assumption.'],['recovery plan','telafi / toparlanma planı','We will share a recovery plan today.'],['cut-off','son kabul zamanı','The terminal cut-off is 18:00.'],['approval','onay','The documents are awaiting approval.'],['idle time','boşta geçen süre','Missing files cause idle time.'],['buffer','tampon','A time buffer protects the loading station.'],['root cause','kök neden','We need to identify the root cause.'],['trade-off','bir yarar için başka yarardan ödün verme','Can we avoid this trade-off?'],['dispatch','sevkiyat / gönderim','Dispatch is limited to 50 pallets a day.'],['turnaround time','işi tamamlama süresi','The turnaround time has improved.'],['consignee','alıcı','Please confirm the consignee details.'],['declaration','beyanname','The declaration requires correction.'],['verified','doğrulanmış','Actual departure has not been verified.'],['subordinate','diğer faaliyetleri kısıta uyumlamak','We should subordinate upstream release to loading capacity.']];
function active(label){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.textContent===label));window.scrollTo?.(0,0)}
home=function(){active('Merkez');const n=Object.keys(state.done).length,c=state.campaign;app.innerHTML=`<section class="card hero"><div class="tag">WORKFLOW ENGLISH • V2</div><h2>Kontrol kulesi<br>artık senin.</h2><p>Operasyonu yönet. Kararını İngilizce anlat.<br>Darboğazı ölçerek iyileştir.</p><button class="primary" onclick="campaign()">${c&&!c.finished?'Vardiyaya devam et':'Yeni vardiyaya başla'} →</button><div class="scene"><span><b>15</b>İş vakası</span><span><b>6</b>Vardiya kararı</span><span><b>24</b>İş ifadesi</span></div></section><div class="kpi"><div><strong>${state.xp}</strong>Deneyim</div><div><strong>${n}/15</strong>Çözülen vaka</div><div><strong>${Object.values(state.cards).filter(x=>x.level>=2).length}/24</strong>Pekişen ifade</div></div><h3>Bugün neyi geliştirelim?</h3><div class="grid"><button class="tile" onclick="filter='All';start()">◈<b>İş vakaları</b><small>Karar + İngilizce yanıt</small></button><button class="tile" onclick="lab()">▥<b>Akış laboratuvarı</b><small>Kapasite, kuyruk ve bekleme</small></button><button class="tile" onclick="words()">Aa<b>İfade antrenmanı</b><small>Türkçe, örnek ve tekrar</small></button><button class="tile" onclick="theory()">◎<b>TOC akademisi</b><small>Kök neden ve çatışma çözümü</small></button></div><section class="card"><h3>Kısa ve uygulanabilir</h3><p>Bir senaryo çöz, üç cümle yaz, bir ifadeyi hatırla. Türkçe açıklamalar isteğe bağlıdır.</p><small>İngilizce kontrolü yerel bir kontrol listesidir. Operasyon modelleri eğitim içindir; gerçek şirket verisi kullanılmaz.</small></section>`};
render=function(){active('Simülasyon');oldRender();document.getElementById('hint').insertAdjacentHTML('beforeend','<p class="muted">'+esc(current.why)+'</p>');document.querySelector('#reply').insertAdjacentHTML('beforebegin','<details><summary>Yanıt kurma desteği</summary><p><b>Durum:</b> The shipment is currently…<br><b>Aksiyon:</b> We are checking… / We propose…<br><b>Zaman:</b> We will update you by…<br><b>Gerekçe:</b> This should reduce…</p></details>')};
speak=function(t){if(window.NativeSpeech&&t.trim()){window.NativeSpeech.speak(t);return}oldSpeak(t)};
check=function(){oldCheck();let t=document.getElementById('reply').value;if(t.trim()){let notes=[];if(/\binformations\b/i.test(t))notes.push('“Information” sayılamaz: informations yerine information kullan.');if(/\bdiscuss about\b/i.test(t))notes.push('“Discuss the issue” kullan; discuss about the issue yerine.');if(/\bwe is\b/i.test(t))notes.push('“We are” kullan.');if(/\bplease find attached\b/i.test(t)&&!/attach|file/i.test(current.message))notes.push('Ek dosya ifadesini yalnızca gerçekten ek varsa kullan.');if(notes.length)document.getElementById('writing').insertAdjacentHTML('beforeend','<p class="note">'+notes.map(esc).join('<br>')+'</p>')}};
function mm1(a,m){if(!Number.isFinite(a)||!Number.isFinite(m)||a<0||m<=0)return {invalid:true};let rho=a/m;if(rho>=1)return {rho,stable:false};return {rho,stable:true,lq:rho*rho/(1-rho),wq:60*rho/(m-a),w:60/(m-a),l:a/(m-a)}}
function lab(){active('');app.innerHTML=`<section class="card hero"><div class="tag">AKIŞ LABORATUVARI</div><h2>Küçük yük artışı.<br>Büyük bekleme.</h2><p>Tek servis kanallı kuyruk modelinde geliş ve hizmet hızlarını değiştir.</p></section><section class="card"><label>Geliş hızı λ: <b id="av">8</b> araç/saat<input id="arrival" type="range" min="0" max="20" step=".5" value="8" oninput="calcLab()"></label><label>Hizmet hızı μ: <b id="sv">10</b> araç/saat<input id="service" type="range" min="1" max="24" step=".5" value="10" oninput="calcLab()"></label><div id="labResult"></div><details><summary>Modeli ve varsayımları gör</summary><p>M/M/1: Poisson gelişler, bağımsız üstel hizmet süreleri, tek sunucu, ilk gelen ilk hizmet, sınırsız kuyruk ve nüfus. Kararlı durum için λ &lt; μ gerekir.</p><p>ρ = λ/μ<br>Lq = ρ²/(1−ρ)<br>Wq = λ/[μ(μ−λ)] saat<br>W = 1/(μ−λ) saat.</p><small>Bu analitik ortalamalar kısa bir vardiyanın kesin sonucu değildir. Gerçek randevulu veya çok kapılı süreçler farklı modeller gerektirir. λ=μ sınırında da sonlu kararlı durum yoktur.</small></details></section><section class="card"><h3>Vardiya kuyruğu • ayrı model</h3><p>Sabit hızlarla 4 saatin sonunda oluşan iş birikimini hesapla. Rastgele geliş içermez.</p><label>Başlangıç kuyruğu<input id="initial" type="number" min="0" max="500" value="12" oninput="calcLab()"></label><div id="fluid"></div></section>`;calcLab()}
function calcLab(){let a=+document.getElementById('arrival').value,m=+document.getElementById('service').value,r=mm1(a,m);document.getElementById('av').textContent=a;document.getElementById('sv').textContent=m;document.getElementById('labResult').innerHTML=`<p>Kapasite kullanımı: <b>${(r.rho*100).toFixed(0)}%</b></p><div class="meter"><i style="width:${Math.min(100,r.rho*100)}%"></i></div>`+(r.stable?`<div class="kpi"><div><strong>${r.lq.toFixed(1)}</strong>Kuyrukta araç</div><div><strong>${r.wq.toFixed(1)}</strong>Bekleme • dk</div><div><strong>${r.w.toFixed(1)}</strong>Toplam • dk</div></div><p class="muted">Hizmet dahil toplam süre ile kuyrukta bekleme farklıdır.</p>`:'<p class="note">Sonlu kararlı durum yok. Bu modelde geliş hızı hizmet hızına eşit veya daha yüksek; sonlu bekleme ortalaması gösterilemez.</p>');let q=+document.getElementById('initial').value;if(!Number.isFinite(q)||q<0||q>500){document.getElementById('fluid').innerHTML='<p>0–500 arasında başlangıç kuyruğu gir.</p>';return}const end=Math.max(0,q+4*(a-m));document.getElementById('fluid').innerHTML=`<p>4 saat sonra yaklaşık <b>${end.toFixed(0)} araç</b> bekler.</p><p class="message">“${end>q?'The backlog will increase unless we adjust arrivals or capacity.':'We can reduce the backlog by maintaining sufficient processing capacity.'}”</p><button onclick="speak(this.previousElementSibling.textContent)">▶ Açıklamayı dinle</button>`}
const turns=[
{time:'08:00',title:'Vardiya açılıyor',text:'Twelve trucks are waiting. Arrivals are 8 trucks per hour, while the loading station can process 6. What should you investigate first?',opts:['Increase picking output.','Confirm the loading constraint and its lost time.','Promise same-day delivery to every customer.'],correct:1,effect:[2,-2,3],why:'Yükleme kapasitesi geliş hızından düşük. Önce kapasiteyi ve kayıp zamanı doğrula.',model:'We have identified loading as the current constraint. We will review idle time before proposing additional capacity.'},
{time:'09:00',title:'Eksik evrak',text:'The loading team loses time correcting incomplete files. A pre-check can recover one truck per hour without new equipment.',opts:['Introduce a document pre-check.','Send incomplete files faster.','Buy upstream equipment first.'],correct:0,effect:[-3,3,2],why:'Ön kontrol mevcut darboğaz kapasitesini korur: Exploit.',model:'We will introduce a document pre-check to reduce rework and protect loading capacity.'},
{time:'10:00',title:'Toplama baskısı',text:'Picking can release 12 loads per hour. Loading can now handle 7. The warehouse manager asks whether picking should run at full speed.',opts:['Release every load immediately.','Measure only picking productivity.','Align releases with loading capacity and due dates.'],correct:2,effect:[4,3,-3],why:'Diğer ekipleri darboğaz temposuna uyumla: Subordinate.',model:'We should align order release with loading capacity and delivery urgency to avoid excess work in progress.'},
{time:'11:00',title:'Çatışan hedefler',text:'Sales wants immediate release to protect customers. Operations wants fewer waiting loads. Both want reliable delivery. Which assumption should be challenged?',opts:['Reliable delivery always requires releasing every order immediately.','Customers need status updates.','Loading has a capacity limit.'],correct:0,effect:[-2,1,1],why:'Ortak hedefi koruyup çatışmayı doğuran varsayımı sorgula. Kontrollü salım ve görünür öncelik planı iki ihtiyaca da yardımcı olabilir.',model:'Our shared goal is reliable delivery. Immediate release is not always necessary; we propose controlled release with clear customer updates.'},
{time:'13:00',title:'Ek vardiya kararı',text:'After reducing lost time and controlling releases, demand still exceeds capacity. A trained backup team can add two trucks per hour at an extra cost.',opts:['Reject every capacity increase.','Evaluate a backup-team pilot against service and cost targets.','Hire more pickers instead.'],correct:1,effect:[2,-4,2],why:'İlk iyileştirmeler yetmiyorsa hedefli kapasite artışını ölçülü dene: Elevate.',model:'We propose a backup-team pilot. We will measure its impact on waiting time, completed loads and operating expense.'},
{time:'16:00',title:'Yeni engel',text:'After today’s changes, some ready shipments are awaiting customs approval. What should you do before assigning tomorrow’s resources?',opts:['Keep optimising only loading.','Declare the entire process solved.','Reassess the constraint using loading and customs data.'],correct:2,effect:[2,3,-3],why:'Kısıt yer değiştirmiş olabilir. Yükleme ve gümrük beklemelerini ölçüp mevcut kısıtı yeniden belirle: Repeat.',model:'We will compare loading and customs waiting times to identify the current constraint before assigning tomorrow’s resources.'}
];
function campaign(){active('Simülasyon');if(!state.campaign)state.campaign={index:0,queue:12,score:0,history:[],finished:false};showTurn()}
function showTurn(){let c=state.campaign;if(c.finished){campaignEnd();return}let t=turns[c.index];app.innerHTML=`<section class="card hero"><div class="tag">CANLI VARDİYA • ${t.time} • ${c.index+1}/6</div><h2>${t.title}</h2><div class="kpi"><div><strong>${c.queue}</strong>Bekleyen yük</div><div><strong>${c.score}</strong>Karar puanı</div><div><strong>${6-c.index}</strong>Kalan karar</div></div><progress value="${c.index}" max="6"></progress></section><section class="card"><p class="message">${t.text}</p><button onclick="speak(turns[state.campaign.index].text)">▶ Durumu dinle</button><h3>What is your next move?</h3><div class="options">${shuffle(t.opts.map((text,i)=>({text,i}))).map(x=>`<button onclick="act(${x.i})">${x.text}</button>`).join('')}</div><div id="outcome"></div></section><p class="muted">Bekleyen yük sayısı öğretici senaryo puanlamasıdır; kuyruk laboratuvarının matematik modeli değildir.</p>`;if(c.locked)act(c.lastChoice,true)}
function act(i,resume=false){let c=state.campaign;if(c.locked&&!resume)return;let t=turns[c.index];let ok=i===t.correct;if(!resume){c.locked=true;c.lastChoice=i;c.queue=Math.max(0,c.queue+t.effect[i]);c.score+=ok?20:0;c.history.push({title:t.title,ok,why:t.why,model:t.model});save();}document.querySelectorAll('.options button').forEach(b=>b.disabled=true);document.getElementById('outcome').innerHTML=`<div class="feedback"><h3>${ok?'İyi karar ✓':'Kararının bir bedeli var'}</h3><p>${t.why}</p><p>Bekleyen yük: <b>${c.queue}</b></p><label>Ekibe İngilizce mesajın<textarea id="turnReply" oninput="saveTurnDraft(this.value)" placeholder="We have identified… We propose…">${esc(c.history[c.history.length-1].reply||'')}</textarea></label><button onclick="turnSupport()">Yanıt desteği</button><div id="turnSupport"></div><details><summary>Örnek iş mesajı</summary><p>${t.model}</p><button onclick="speak(turns[state.campaign.index].model)">▶ Dinle</button></details><button class="primary" onclick="advanceTurn()">Vardiyaya devam →</button></div>`}
function saveTurnDraft(v){let c=state.campaign;c.history[c.history.length-1].reply=v;save()}
function turnSupport(){let text=document.getElementById('turnReply').value.trim();document.getElementById('turnSupport').innerHTML='<p class="note">'+(text?'Yanıtını örnekle karşılaştır: durumu belirttin mi, somut aksiyon verdin mi, sonucu veya zamanı açıkladın mı?':'Önce durum + aksiyon + beklenen sonuç yapısıyla 2–3 İngilizce cümle yaz.')+'</p>'}
function advanceTurn(){let c=state.campaign;if(!c.locked)return;c.history[c.history.length-1].reply=document.getElementById('turnReply').value;c.index++;c.locked=false;if(c.index===turns.length){c.finished=true;state.xp+=c.score;}save();showTurn()}
function campaignEnd(){let c=state.campaign;app.innerHTML=`<section class="card hero"><div class="tag">VARDİYA RAPORU</div><h2>${c.score>=100?'Akışı yönettin.':'Her karar bir öğrenme.'}</h2><div class="kpi"><div><strong>${c.score}/120</strong>Karar puanı</div><div><strong>${c.queue}</strong>Son iş birikimi</div><div><strong>${c.history.filter(x=>x.ok).length}/6</strong>Doğru karar</div></div></section><section class="card">${c.history.map(x=>`<div class="log"><b>${x.ok?'✓':'○'} ${esc(x.title)}</b><p>${esc(x.why)}</p>${x.reply?'<small>Yanıtın: '+esc(x.reply)+'</small>':''}</div>`).join('')}</section><button class="primary" onclick="state.campaign=null;save();campaign()">Yeni vardiya →</button><p class="muted">XP bu vardiya tamamlanırken bir kez eklendi.</p>`}
const lessons=[['Ortak hedef','Herkesi meşgul tutmak yerine sistemin hedefine katkıyı değerlendir. Yük toplama artarken teslim edilen yük sayısı aynı kalıyorsa yerel üretkenlik seni yanıltabilir.','Our goal is reliable delivery, not maximum activity at every station.'],['Neden → sonuç','Gecikme bir belirtidir. Eksik evrak → tekrar inceleme → gümrük kuyruğu → kaçan cut-off zincirini kontrol et. Her bağlantı veriyle doğrulanması gereken bir hipotezdir.','Missing documents cause rework, which delays customs approval.'],['Çatışma bulutu','Ortak hedef: güvenilir teslimat. İhtiyaçlar: hızlı müşteri yanıtı ve kontrollü iş birikimi. Çatışan eylemler: her işi hemen salmak ve işi sınırlı salmak. “Hızlı teslimat için bütün işler hemen salınmalı” varsayımını sorgula.','Can we meet both needs by changing the release policy?'],['Değişim konuşması','Neyi değiştireceğiz? Neye dönüştüreceğiz? Değişimi nasıl sağlayacağız? Ekibe neden, plan, sorumlu, süre ve ölçüm sun; sadece talimat verme.','We propose a two-week pilot with a clear owner and measurable targets.'],['Kazanç ve ölçüm','Operasyonel çıktı hızı ile TOC finansındaki throughput aynı birim değildir. TOC throughput, satışların tamamen değişken maliyetler düşüldükten sonra kazanç yaratma hızıdır. Satılmayan üretimi satış kazancı gibi sayma.','More production does not automatically create more throughput from sales.']];
theory=function(){active('TOC');oldTheory();app.insertAdjacentHTML('beforeend','<section class="card hero"><div class="tag">GOLDRATT • DÜŞÜNME ARAÇLARI</div><h2>Darboğazdan kök nedene.</h2><p>Kitabın tam metni yerine doğrulanan TOC kavramlarına dayalı özgün uygulamalar.</p></section>'+lessons.map((l,i)=>`<section class="card"><span class="stepnum">0${i+1}</span><h3>${l[0]}</h3><p>${l[1]}</p><p class="message">${l[2]}</p><button onclick="speak(lessons[${i}][2])">▶ İş cümlesini dinle</button></section>`).join('')+'<section class="card"><p>Kaynak çerçevesi: E. M. Goldratt, What Is This Thing Called Theory of Constraints and How Should It Be Implemented?; TOC Goldratt düşünme süreçleri; gönderilen Birth–Death Processes ders notları.</p><a href="https://www.toc-goldratt.com/en/about-toc">TOC Goldratt kaynak açıklaması</a></section>')};
let cardQueue=[],cardIndex=0,flipped=false;
function words(){active('Tekrar');cardQueue=shuffle(lexicon.map((_,i)=>i)).sort((a,b)=>(state.cards[a]?.due||0)-(state.cards[b]?.due||0));cardIndex=0;showCard()}
function showCard(){flipped=false;if(cardIndex>=cardQueue.length){app.innerHTML='<section class="card hero"><h2>İfade turu tamamlandı.</h2><p>Örnekleri yeni iş mesajlarında kullanarak pekiştir.</p><button onclick="home()">Merkeze dön</button></section>';return}let i=cardQueue[cardIndex],w=lexicon[i],s=state.cards[i]||{level:0};app.innerHTML=`<section class="card hero"><div class="tag">İFADE ANTRENMANI • ${cardIndex+1}/24</div><h2>${w[0]}</h2><p>Türkçe anlamını ve bir iş cümlesini hatırla.</p><button onclick="speak(lexicon[cardQueue[cardIndex]][0])">▶ Telaffuz</button><button class="primary" onclick="flipCard()">Anlamı göster</button><div id="cardAnswer" class="hidden"><h3>${w[1]}</h3><p class="message">${w[2]}</p><button onclick="speak(lexicon[cardQueue[cardIndex]][2])">▶ Örnek</button><p>Hatırlama seviyen: ${s.level}/3</p><div class="row"><button onclick="gradeCard(false)">Tekrar gerekli</button><button class="primary" onclick="gradeCard(true)">Hatırladım ✓</button></div></div></section><small>Kendini değerlendirme: tekrar gerekli → 10 dakika; hatırladım → seviyeye göre 1, 3 veya 7 gün. Sıralamada en erken tekrar zamanı önce gelir.</small><section class="card"><h3>Yanlış kararlar</h3><p>${state.errors.length} iş vakası tekrar bekliyor.</p><button onclick="filter='All';start(true)">Karar tekrarına geç</button></section>`}
function flipCard(){flipped=true;document.getElementById('cardAnswer').classList.remove('hidden')}
function gradeCard(ok){if(!flipped)return;flipped=false;let i=cardQueue[cardIndex],c=state.cards[i]||{level:0};c.level=ok?Math.min(3,c.level+1):0;c.due=Date.now()+(ok?[1,3,7][c.level-1]*86400000:600000);state.cards[i]=c;save();cardIndex++;showCard()}
document.querySelector('nav').innerHTML='<button onclick="home()">Merkez</button><button onclick="campaign()">Simülasyon</button><button onclick="words()">Tekrar</button><button onclick="theory()">TOC</button>';
home();

</script></html>
